<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 연금술사</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (브라우저에서 JSX 컴파일) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Firebase 모듈 가져오기 (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Firebase 초기화 ---
        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // [참고] 외부 서버에 호스팅할 경우 본인의 Firebase 설정을 여기에 입력하세요.
            firebaseConfig = {
                apiKey: "AIzaSyAeKjzEWOvqmP4hYRM_NEZY1GEZ1reerAI",
                authDomain: "alchemist-ef277.firebaseapp.com",
                projectId: "alchemist-ef277",
                storageBucket: "alchemist-ef277.firebasestorage.app",
                messagingSenderId: "485393554873",
                appId: "1:485393554873:web:6cff9040cd70453d716a68",
                measurementId: "G-CF71EZ2L7N"
            };
        }
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'word-alchemist-local';
        const ROOMS_COLLECTION = 'word_alchemist_rooms';

        // --- SVG 아이콘 컴포넌트 (Lucide 대체) ---
        const Icon = ({ path, className, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style} dangerouslySetInnerHTML={{ __html: path }} />
        );
        const Wand2 = (p) => <Icon {...p} path='<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>' />;
        const AlertCircle = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' />;
        const Flame = (p) => <Icon {...p} path='<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>' />;
        const User = (p) => <Icon {...p} path='<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' />;
        const Swords = (p) => <Icon {...p} path='<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="10"/><line x1="4" y1="16" x2="8" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/>' />;
        const Users2 = (p) => <Icon {...p} path='<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' />;
        const ArrowRight = (p) => <Icon {...p} path='<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>' />;
        const Shield = (p) => <Icon {...p} path='<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' />;
        const Clock = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' />;
        const BookOpen = (p) => <Icon {...p} path='<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' />;
        const Sparkles = (p) => <Icon {...p} path='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>' />;
        const Play = (p) => <Icon {...p} path='<polygon points="5 3 19 12 5 21 5 3"/>' />;
        const Trophy = (p) => <Icon {...p} path='<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' />;

        // --- 게임 기본 데이터 및 로직 ---
        const LETTER_SCORES = {
            A:1, E:1, I:1, O:1, U:1, L:1, N:1, S:1, T:1, R:1,
            D:2, G:2,
            B:3, C:3, M:3, P:3,
            F:4, H:4, V:4, W:4, Y:4,
            K:5, J:8, X:8, Q:10, Z:10
        };

        const getLengthBonus = (length) => {
            if (length <= 3) return 0;
            if (length === 4) return 2;
            if (length === 5) return 5;
            if (length === 6) return 8;
            return 12; 
        };

        const generateLetters = () => {
            const vowels = 'AAAAEEEEIIIOOOUU'.split('');
            const consonants = 'BBCCDDFFGGHHJKLLMMNNPPRRSSTTVVWWXYYZ'.split('');
            const letters = [];
            for(let i=0; i<6; i++) letters.push(vowels[Math.floor(Math.random() * vowels.length)]);
            for(let i=0; i<10; i++) letters.push(consonants[Math.floor(Math.random() * consonants.length)]);
            return letters.sort(() => Math.random() - 0.5);
        };

        const generateRoomCode = () => Math.floor(1000 + Math.random() * 9000).toString();

        // --- 메인 컴포넌트 ---
        function WordAlchemistApp() {
            const [user, setUser] = useState(null);
            const [roomId, setRoomId] = useState('');
            const [roomData, setRoomData] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [isJoining, setIsJoining] = useState(false);

            const [userInfo, setUserInfo] = useState({ grade: '', classNum: '', studentNum: '', name: '' });
            const [selectedMode, setSelectedMode] = useState(null); 

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setErrorMsg("인증에 실패했습니다.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !roomId || isJoining) return;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomId);
                const unsubscribe = onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setRoomData(docSnap.data());
                    } else {
                        setErrorMsg("방이 사라졌거나 존재하지 않습니다.");
                        setRoomId('');
                        setRoomData(null);
                    }
                }, (error) => {
                    console.error("Listen Error:", error);
                    setErrorMsg("데이터를 불러오는데 문제가 발생했습니다.");
                });

                return () => unsubscribe();
            }, [user, roomId, isJoining]);

            const handleCreateRoom = async (mode) => {
                if (!user) return;
                const displayName = `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${userInfo.name}`;
                const newRoomId = mode === 'single' ? `SINGLE_${user.uid.slice(0,6)}` : generateRoomCode();
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, newRoomId);
                
                try {
                    const initialData = {
                        roomId: newRoomId,
                        hostId: user.uid,
                        status: mode === 'single' ? 'playing' : 'waiting', 
                        mode: mode,
                        letters: generateLetters(),
                        endTime: mode === 'single' ? Date.now() + 90 * 1000 : null,
                        players: {
                            [user.uid]: { name: displayName, team: 'red' }
                        },
                        words: {}
                    };
                    await setDoc(roomRef, initialData);
                    setRoomId(newRoomId);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 생성에 실패했습니다.");
                    console.error(err);
                }
            };

            const handleJoinRoom = async (codeToJoin) => {
                if (!codeToJoin || codeToJoin.length !== 4) return setErrorMsg("올바른 4자리 방 코드를 입력하세요.");
                if (!user) return;

                setIsJoining(true);
                const displayName = `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${userInfo.name}`;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, codeToJoin);
                try {
                    const docSnap = await getDoc(roomRef);
                    if (!docSnap.exists()) {
                        setErrorMsg("존재하지 않는 방입니다.");
                        setIsJoining(false);
                        return;
                    }
                    const data = docSnap.data();

                    // ✅ 같은 브라우저(동일인) 중복 접속 방지 및 테스트 안내 추가
                    if (data.players[user.uid]) {
                        setErrorMsg("이미 이 방에 접속해 있습니다. (혼자 테스트하려면 '새 시크릿 창'을 이용하세요!)");
                        setIsJoining(false);
                        return;
                    }

                    if (data.status !== 'waiting') {
                        setErrorMsg("이미 게임이 시작되었거나 종료되었습니다.");
                        setIsJoining(false);
                        return;
                    }
                    if (data.mode === '1v1' && Object.keys(data.players).length >= 2) {
                        setErrorMsg("1:1 대결 방은 이미 꽉 찼습니다.");
                        setIsJoining(false);
                        return;
                    }

                    let assignedTeam = 'blue';
                    if (data.mode === 'team') {
                        const redCount = Object.values(data.players).filter(p => p.team === 'red').length;
                        const blueCount = Object.values(data.players).filter(p => p.team === 'blue').length;
                        assignedTeam = redCount > blueCount ? 'blue' : 'red';
                    }

                    await updateDoc(roomRef, {
                        [`players.${user.uid}`]: { name: displayName, team: assignedTeam }
                    });

                    setRoomId(codeToJoin);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 참가에 실패했습니다.");
                } finally {
                    setIsJoining(false);
                }
            };

            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-50 text-indigo-800">
                        <Wand2 className="w-10 h-10 animate-spin text-fuchsia-600 mr-3" />
                        <h1 className="text-2xl font-bold">마나를 모으는 중...</h1>
                    </div>
                );
            }

            return (
                <div className="h-screen overflow-hidden flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-fuchsia-200 selection:text-fuchsia-900">
                    <header className="bg-white/80 border-b border-slate-200 py-2 px-4 shadow-sm backdrop-blur-md flex-shrink-0">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-2 text-fuchsia-600">
                                <Flame className="w-5 h-5" />
                                <h1 className="text-lg font-black tracking-wider">단어 연금술사</h1>
                            </div>
                            {userInfo.name && (
                                <div className="text-xs text-slate-500 font-medium">
                                    <span className="font-bold text-indigo-600">{userInfo.name}</span> 연금술사
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden w-full max-w-5xl mx-auto p-2 md:p-3 flex flex-col">
                        {errorMsg && (
                            <div className="mb-2 p-2 bg-red-50 border border-red-200 rounded-lg flex items-center text-red-600 animate-in slide-in-from-top-2 shadow-sm flex-shrink-0 text-sm">
                                <AlertCircle className="w-4 h-4 mr-2 flex-shrink-0" />
                                <span className="font-medium">{errorMsg}</span>
                                <button onClick={() => setErrorMsg('')} className="ml-auto text-red-400 hover:text-red-600">✕</button>
                            </div>
                        )}

                        {!roomData && (
                            <LobbyView 
                                userInfo={userInfo} setUserInfo={setUserInfo}
                                selectedMode={selectedMode} setSelectedMode={setSelectedMode}
                                onCreateRoom={handleCreateRoom} onJoinRoom={handleJoinRoom} 
                            />
                        )}

                        {roomData && roomData.status === 'waiting' && (
                            <WaitingRoomView roomData={roomData} user={user} />
                        )}

                        {roomData && (roomData.status === 'playing' || roomData.status === 'finished') && (
                            <GameManager roomData={roomData} user={user} />
                        )}
                    </main>
                    
                    {/* 제작자 및 저작권 정보 푸터 추가 */}
                    <footer className="py-2 flex-shrink-0 text-center bg-transparent z-10">
                        <p className="text-[10px] text-slate-400 font-medium">만든이: 곽현석(이의초등학교)</p>
                        <p className="text-[10px] text-slate-400">Copyright © 2026 Eui Elementary School. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        }

        // --- 하위 컴포넌트: 로비 ---
        function LobbyView({ userInfo, setUserInfo, selectedMode, setSelectedMode, onCreateRoom, onJoinRoom }) {
            const [joinCode, setJoinCode] = useState('');
            const isInfoComplete = userInfo.grade && userInfo.classNum && userInfo.studentNum && userInfo.name.trim();

            const handleInfoChange = (e) => {
                const { name, value } = e.target;
                setUserInfo(prev => ({ ...prev, [name]: value }));
            };

            return (
                <div className="flex flex-col items-center justify-start pt-2 sm:pt-4 h-full w-full max-w-4xl mx-auto px-2 overflow-y-auto custom-scrollbar pb-4 space-y-3 sm:space-y-4">
                    <div className="text-center space-y-1 sm:space-y-2 animate-in slide-in-from-top-4 fade-in duration-700 flex-shrink-0">
                        <div className="inline-flex p-2 sm:p-3 rounded-full bg-white border-2 border-indigo-100 mb-1 shadow-[0_4px_15px_rgba(99,102,241,0.15)]">
                            <Flame className="w-8 h-8 sm:w-10 sm:h-10 text-fuchsia-500 animate-pulse" />
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-600 via-indigo-600 to-amber-500 tracking-tight">
                            단어 연금술사
                        </h2>
                        <p className="text-slate-500 text-xs sm:text-sm font-medium">알파벳 마법석을 조합해 전설의 단어를 연성하라!</p>
                    </div>

                    <div className="w-full bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm z-10 relative flex-shrink-0">
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-indigo-600 text-white px-4 py-1 rounded-full text-xs font-bold shadow-md flex items-center">
                            <User className="w-3 h-3 mr-1"/> 1단계: 연금술사 등록
                        </div>
                        
                        <div className="grid grid-cols-4 gap-3 mt-2">
                            <div className="col-span-2 sm:col-span-1">
                                <label className="block text-[10px] text-indigo-600 mb-1 ml-1 font-bold">학년</label>
                                <input type="number" name="grade" value={userInfo.grade} onChange={handleInfoChange} placeholder="1" className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-center text-slate-900 text-base font-bold focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner" />
                            </div>
                            <div className="col-span-2 sm:col-span-1">
                                <label className="block text-[10px] text-indigo-600 mb-1 ml-1 font-bold">반</label>
                                <input type="number" name="classNum" value={userInfo.classNum} onChange={handleInfoChange} placeholder="3" className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-center text-slate-900 text-base font-bold focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner" />
                            </div>
                            <div className="col-span-2 sm:col-span-1">
                                <label className="block text-[10px] text-indigo-600 mb-1 ml-1 font-bold">번호</label>
                                <input type="number" name="studentNum" value={userInfo.studentNum} onChange={handleInfoChange} placeholder="15" className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-center text-slate-900 text-base font-bold focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner" />
                            </div>
                            <div className="col-span-2 sm:col-span-1">
                                <label className="block text-[10px] text-indigo-600 mb-1 ml-1 font-bold">이름</label>
                                <input type="text" name="name" value={userInfo.name} onChange={handleInfoChange} placeholder="홍길동" className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-center text-slate-900 text-base font-bold focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner" />
                            </div>
                        </div>
                    </div>

                    <div className={`w-full transition-all duration-700 ease-out transform flex-shrink-0 ${isInfoComplete ? 'opacity-100 translate-y-0' : 'opacity-40 pointer-events-none translate-y-4'}`}>
                        <div className="text-center mb-2 sm:mb-3 mt-1">
                            <span className="bg-fuchsia-50 text-fuchsia-700 px-3 py-1 rounded-full text-[11px] font-bold border border-fuchsia-200 shadow-sm">
                                2단계: 도전 모드 선택
                            </span>
                        </div>

                        {!selectedMode ? (
                            <div className="grid sm:grid-cols-3 gap-4">
                                <button onClick={() => onCreateRoom('single')} className="flex flex-col items-center p-5 bg-white hover:bg-fuchsia-50/50 rounded-2xl border border-slate-200 hover:border-fuchsia-400 transition-all group shadow-sm hover:shadow-md hover:-translate-y-1">
                                    <div className="bg-fuchsia-50 p-3 rounded-xl mb-3 group-hover:scale-110 transition-transform"><User className="w-6 h-6 text-fuchsia-500" /></div>
                                    <h4 className="font-black text-slate-800 text-base mb-1 group-hover:text-fuchsia-600">1인 연습</h4>
                                    <p className="text-[11px] text-slate-500 text-center">혼자서 단어 연성<br/>최고 기록 세우기</p>
                                </button>
                                <button onClick={() => setSelectedMode('1v1')} className="flex flex-col items-center p-5 bg-white hover:bg-amber-50/50 rounded-2xl border border-slate-200 hover:border-amber-400 transition-all group shadow-sm hover:shadow-md hover:-translate-y-1">
                                    <div className="bg-amber-50 p-3 rounded-xl mb-3 group-hover:scale-110 transition-transform"><Swords className="w-6 h-6 text-amber-500" /></div>
                                    <h4 className="font-black text-slate-800 text-base mb-1 group-hover:text-amber-600">1:1 진검승부</h4>
                                    <p className="text-[11px] text-slate-500 text-center">친구와 방을 파서<br/>둘이서 점수 대결</p>
                                </button>
                                <button onClick={() => setSelectedMode('team')} className="flex flex-col items-center p-5 bg-white hover:bg-blue-50/50 rounded-2xl border border-slate-200 hover:border-blue-400 transition-all group shadow-sm hover:shadow-md hover:-translate-y-1">
                                    <div className="bg-blue-50 p-3 rounded-xl mb-3 group-hover:scale-110 transition-transform"><Users2 className="w-6 h-6 text-blue-500" /></div>
                                    <h4 className="font-black text-slate-800 text-base mb-1 group-hover:text-blue-600">학급 팀 대결</h4>
                                    <p className="text-[11px] text-slate-500 text-center">다같이 모여<br/>팀별 점수 합산 대결</p>
                                </button>
                            </div>
                        ) : (

                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center h-full flex flex-col justify-center">

                                            />
                                            <button onClick={() => onJoinRoom(joinCode)} className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold transition-colors shadow-sm text-sm">
                                                입장하기
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- 하위 컴포넌트: 대기실 ---
        function WaitingRoomView({ roomData, user }) {
            const isHost = roomData.hostId === user.uid;
            const players = Object.entries(roomData.players || {});
            const isTeamMode = roomData.mode === 'team';

            const handleStartGame = async () => {
                if (!isHost) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                await updateDoc(roomRef, {
                    status: 'playing',
                    endTime: Date.now() + 90 * 1000, 
                    letters: generateLetters(), 
                    words: {}
                });
            };

            const handleSwitchTeam = async () => {
                if (!isTeamMode) return;
                const myTeam = roomData.players[user.uid]?.team;
                const newTeam = myTeam === 'red' ? 'blue' : 'red';
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                await updateDoc(roomRef, {
                    [`players.${user.uid}.team`]: newTeam
                });
            };

            return (
                <div className="max-w-4xl w-full mx-auto flex flex-col h-full space-y-4 animate-in fade-in pb-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 text-center flex flex-col sm:flex-row items-center justify-between shadow-sm flex-shrink-0">
                        <div className="text-left mb-3 sm:mb-0">
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold mb-2 inline-block border border-indigo-100">
                                {roomData.mode === '1v1' ? '1:1 대결 모드' : '학급 팀 대결 모드'}
                            </span>
                            <p className="text-slate-500 text-xs font-medium">친구에게 아래 코드를 알려주세요</p>
                        </div>
                        <div className="text-5xl font-black text-amber-500 tracking-[0.2em] drop-shadow-sm">
                            {roomData.roomId}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 min-h-[150px]">
                        {isTeamMode ? (
                            <div className="grid md:grid-cols-2 gap-4 h-full">
                                <div className="bg-white border border-red-200 rounded-2xl p-4 shadow-sm relative overflow-hidden flex flex-col">
                                    <div className="absolute top-0 right-0 w-24 h-24 bg-red-50 rounded-full -mr-8 -mt-8 opacity-50 pointer-events-none"></div>
                                    <h3 className="text-lg font-bold text-red-600 mb-3 flex items-center border-b border-red-100 pb-2 flex-shrink-0"><Shield className="w-4 h-4 mr-2"/> 레드 팀</h3>
                                    <div className="space-y-2 relative z-10 flex-1 overflow-y-auto custom-scrollbar">
                                        {players.filter(([uid, p]) => p.team === 'red').map(([uid, p]) => (
                                            <div key={uid} className="bg-red-50 border border-red-100 p-2 rounded-lg text-red-900 font-bold text-sm flex justify-between items-center">
                                                {p.name} {uid === user.uid && <span className="text-[10px] bg-red-200 text-red-800 px-1.5 py-0.5 rounded-md">나</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white border border-blue-200 rounded-2xl p-4 shadow-sm relative overflow-hidden flex flex-col">
                                     <div className="absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-full -mr-8 -mt-8 opacity-50 pointer-events-none"></div>
                                    <h3 className="text-lg font-bold text-blue-600 mb-3 flex items-center border-b border-blue-100 pb-2 flex-shrink-0"><Shield className="w-4 h-4 mr-2"/> 블루 팀</h3>
                                    <div className="space-y-2 relative z-10 flex-1 overflow-y-auto custom-scrollbar">
                                        {players.filter(([uid, p]) => p.team === 'blue').map(([uid, p]) => (
                                            <div key={uid} className="bg-blue-50 border border-blue-100 p-2 rounded-lg text-blue-900 font-bold text-sm flex justify-between items-center">
                                                {p.name} {uid === user.uid && <span className="text-[10px] bg-blue-200 text-blue-800 px-1.5 py-0.5 rounded-md">나</span>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl p-6 border border-slate-200 text-center shadow-sm h-full flex flex-col">
                                <h3 className="text-lg font-bold mb-4 text-slate-800 flex-shrink-0">참여한 연금술사 ({players.length}/2)</h3>
                                <div className="flex flex-wrap justify-center gap-3 flex-1 content-start overflow-y-auto custom-scrollbar">
                                    {players.map(([uid, p]) => (
                                        <div key={uid} className="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 shadow-sm flex items-center">
                                            {p.name} {uid === user.uid && <span className="text-indigo-600 text-xs ml-2 bg-indigo-100 px-1.5 py-0.5 rounded-md">나</span>}
                                        </div>
                                    ))}
                                </div>

                        )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 justify-center items-center flex-shrink-0 mt-2">
                        {isTeamMode && (
                            <button onClick={handleSwitchTeam} className="w-full sm:w-auto px-6 py-3 bg-white hover:bg-slate-50 text-slate-800 rounded-xl font-bold transition-all border border-slate-300 shadow-sm text-sm">
                                팀 바꾸기
                            </button>
                        )}
                        
                        {isHost ? (
                            <button 
                                onClick={handleStartGame}
                                disabled={roomData.mode === '1v1' && players.length < 2}
                                className="w-full sm:flex-1 max-w-md py-3 text-base bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg disabled:shadow-none flex justify-center items-center"
                            >
                                <Play className="w-5 h-5 mr-2" /> 
                                {roomData.mode === '1v1' && players.length < 2 ? '상대방을 기다리는 중...' : '연금술 대결 시작!'}
                            </button>
                        ) : (
                            <div className="w-full sm:flex-1 max-w-md py-3 text-sm bg-slate-100 text-slate-500 rounded-xl font-bold flex justify-center items-center animate-pulse border border-slate-200">

                            </div>

        }

        // --- 하위 컴포넌트: 게임 매니저 ---
        function GameManager({ roomData, user }) {
            const [timeLeft, setTimeLeft] = useState(0);

            useEffect(() => {
                if (!roomData.endTime) return;
                
                const updateTimer = () => {
                    const remaining = Math.max(0, Math.floor((roomData.endTime - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    
                    if (remaining === 0 && roomData.status === 'playing' && roomData.hostId === user.uid) {
                        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                        updateDoc(roomRef, { status: 'finished' }).catch(console.error);
                    }
                };

                updateTimer();
                const interval = setInterval(updateTimer, 500);
                return () => clearInterval(interval);
            }, [roomData.endTime, roomData.status, roomData.hostId, user.uid, roomData.roomId]);

            if (timeLeft === 0 || roomData.status === 'finished') {
                return <ResultView roomData={roomData} user={user} />;
            }

            return <GamePlayView roomData={roomData} user={user} timeLeft={timeLeft} />;
        }

        // --- 하위 컴포넌트: 실제 플레이 화면 ---
        function GamePlayView({ roomData, user, timeLeft }) {
            const [selectedIndices, setSelectedIndices] = useState([]);
            const [localError, setLocalError] = useState('');
            const [isChecking, setIsChecking] = useState(false);
            const letters = roomData.letters || [];

            const handleKeyDown = useCallback((e) => {
                if (e.key === 'Enter') {
                    if (!isChecking) handleSubmit();
                } else if (e.key === 'Backspace') {
                    setSelectedIndices(prev => prev.slice(0, -1));
                } else if (/^[a-zA-Z]$/.test(e.key)) {
                    const char = e.key.toUpperCase();
                    const availableIndex = letters.findIndex((l, i) => l === char && !selectedIndices.includes(i));
                    if (availableIndex !== -1) {
                        setSelectedIndices(prev => [...prev, availableIndex]);
                    }
                }
            }, [selectedIndices, letters, isChecking]);

            useEffect(() => {
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleKeyDown]);

            const mySubmittedWords = useMemo(() => {
                const wordsObj = roomData.words || {};
                return Object.entries(wordsObj)
                    .filter(([word, finders]) => finders.includes(user.uid))
                    .map(([word]) => word)
                    .reverse();
            }, [roomData.words, user.uid]);

            const handleSubmit = async () => {
                if (isChecking) return;
                if (selectedIndices.length < 2) {
                    setLocalError("2글자 이상 입력하세요!");
                    setTimeout(()=>setLocalError(''), 1500);
                    return;
                }
                const cleanWord = selectedIndices.map(idx => letters[idx]).join('');
                if (mySubmittedWords.includes(cleanWord)) {
                    setLocalError("이미 연성한 단어입니다!");
                    setSelectedIndices([]);
                    setTimeout(()=>setLocalError(''), 1500);
                    return;
                }

                setIsChecking(true);
                setLocalError("사전 검색 중... 🔍");

                try {
                    // 외부 영어 사전 API (Free Dictionary API)를 통해 실제 단어인지 검증
                    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
                    
                    if (!res.ok) {
                        setLocalError("사전에 없는 단어입니다! ❌");
                        setTimeout(()=>setLocalError(''), 2000);
                        setIsChecking(false);
                        return;
                    }

                    // 검증 통과 시 데이터베이스에 저장
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                    await updateDoc(roomRef, {
                        [`words.${cleanWord}`]: arrayUnion(user.uid)
                    });
                    setSelectedIndices([]);
                    setLocalError('');
                } catch (err) {
                    console.error("검증 중 오류:", err);
                    setLocalError("검색 중 오류가 발생했습니다!");
                    setTimeout(()=>setLocalError(''), 1500);
                } finally {
                    setIsChecking(false);
                }
            };

            const handlePoolTileClick = (index) => {
                if (!selectedIndices.includes(index)) setSelectedIndices(prev => [...prev, index]);
            };
            const handleSelectedTileClick = (pos) => {
                setSelectedIndices(prev => prev.filter((_, i) => i !== pos));
            };
            
            const currentBaseScore = selectedIndices.reduce((acc, idx) => acc + (LETTER_SCORES[letters[idx]] || 0), 0) + getLengthBonus(selectedIndices.length);

            return (
                <div className="flex flex-col lg:flex-row gap-4 h-full w-full overflow-hidden">
                    <div className="flex-1 flex flex-col space-y-3 min-w-0 h-full">
                        <div className="bg-white rounded-xl p-3 flex items-center justify-between shadow-sm border border-slate-200 flex-shrink-0">
                            <div className="flex items-center text-slate-600 font-bold text-sm">
                                <Clock className={`w-5 h-5 mr-2 ${timeLeft <= 10 ? 'text-red-500 animate-bounce' : 'text-fuchsia-500'}`} />남은 시간
                            </div>
                            <div className={`text-2xl font-black font-mono tracking-tighter ${timeLeft <= 10 ? 'text-red-500' : 'text-slate-800'}`}>
                                0{Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,'0')}
                            </div>
                        </div>

                        <div className="flex-1 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col items-center justify-center relative shadow-sm min-h-[150px]">
                            <h3 className="absolute top-3 left-4 text-xs text-indigo-500 font-bold tracking-widest bg-indigo-50 px-2 py-1 rounded-md">조합대</h3>
                            
                            <div className="flex-1 flex justify-center content-center flex-wrap gap-2 w-full mt-4 overflow-y-auto custom-scrollbar">
                                {selectedIndices.length === 0 ? (
                                    <div className="text-slate-400 text-sm font-medium flex items-center h-12 border-b-2 border-slate-200 border-dashed px-4">마법석 클릭 또는 키보드 입력...</div>
                                ) : (
                                    selectedIndices.map((idx, pos) => (
                                        <button key={`sel-${pos}`} onClick={() => handleSelectedTileClick(pos)}
                                            className="w-10 h-12 sm:w-12 sm:h-14 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-2xl font-black shadow-[0_3px_0_rgb(67,56,202)] hover:bg-red-500 hover:shadow-[0_3px_0_rgb(185,28,28)] hover:-translate-y-0.5 transition-all active:translate-y-0.5 active:shadow-none animate-in zoom-in duration-200 flex-shrink-0">
                                            {letters[idx]}
                                        </button>
                                    ))
                                )}
                            </div>
                            
                            <div className="h-6 mb-3 flex-shrink-0 flex items-center justify-center">
                                {localError ? <p className="text-red-500 font-bold text-xs animate-pulse">{localError}</p> : 
                                    (selectedIndices.length > 0 && <p className="text-amber-600 font-bold text-xs bg-amber-50 px-3 py-1 rounded-full border border-amber-100">예상 {currentBaseScore}점 (독점 시 보너스!)</p>)}
                            </div>

                            <div className="flex gap-2 w-full max-w-sm flex-shrink-0">
                                <button onClick={() => setSelectedIndices(prev => prev.slice(0, -1))} disabled={selectedIndices.length === 0 || isChecking}
                                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 disabled:opacity-50 text-slate-700 rounded-lg font-bold shadow-sm transition-colors text-sm">지우기</button>
                                <button onClick={handleSubmit} disabled={selectedIndices.length < 2 || isChecking}
                                    className="flex-[2] py-2.5 bg-amber-400 hover:bg-amber-300 disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 text-slate-900 rounded-lg font-bold shadow-[0_3px_0_rgb(217,119,6)] hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none disabled:shadow-none border border-amber-500 transition-all flex justify-center items-center text-sm">
                                        <Wand2 className="w-4 h-4 mr-2" /> {isChecking ? '검색 중...' : '연성 (Enter)'}
                                    </button>
                            </div>
                        </div>

                        <div className="bg-slate-100 p-3 sm:p-4 rounded-2xl border border-slate-200 text-center shadow-inner flex-shrink-0">
                            <div className="flex flex-wrap justify-center gap-1.5 sm:gap-2 max-w-xl mx-auto">
                                {letters.map((char, i) => {
                                    const isUsed = selectedIndices.includes(i);
                                    return (
                                        <button key={`pool-${i}`} onClick={() => handlePoolTileClick(i)} disabled={isUsed}
                                            className={`relative w-9 h-10 sm:w-10 sm:h-12 rounded-lg flex items-center justify-center text-lg sm:text-xl font-bold transition-all duration-200 flex-shrink-0
                                                ${isUsed ? 'bg-slate-200 text-slate-400 border border-slate-300 scale-95 shadow-none' 
                                                         : 'bg-white text-slate-800 shadow-[0_3px_0_rgb(203,213,225)] hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none border border-slate-300'}`}>
                                            {char}
                                            {!isUsed && <span className="absolute bottom-0.5 right-1 text-[9px] opacity-60 font-sans text-slate-500 leading-none">{LETTER_SCORES[char]}</span>}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="lg:w-64 xl:w-80 flex-shrink-0 h-full flex flex-col">
                        <div className="bg-white rounded-2xl p-4 h-full border border-slate-200 flex flex-col shadow-sm min-h-0">
                            <h3 className="text-base font-bold text-slate-800 flex items-center mb-3 pb-3 border-b border-slate-100 flex-shrink-0">
                                <BookOpen className="w-4 h-4 mr-2 text-indigo-500" /> 연성 일지
                                <span className="ml-auto bg-indigo-50 text-indigo-700 border border-indigo-100 text-[10px] py-0.5 px-2 rounded-full font-bold">{mySubmittedWords.length}개</span>
                            </h3>
                            <div className="flex-1 overflow-y-auto pr-1 space-y-2 custom-scrollbar">
                                {mySubmittedWords.length === 0 ? (
                                    <div className="text-center text-slate-400 mt-6 text-xs font-medium">단어를 조합하여<br/>기록을 채워보세요!</div>
                                ) : (
                                    mySubmittedWords.map((word, idx) => {
                                        let baseScore = getLengthBonus(word.length);
                                        for(let char of word) baseScore += (LETTER_SCORES[char] || 0);
                                        return (
                                            <div key={idx} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                                <span className="font-black text-slate-700 tracking-wider text-sm">{word}</span>
                                                <span className="text-xs font-bold text-amber-600 bg-amber-50 border border-amber-100 px-1.5 py-0.5 rounded">{baseScore} 점</span>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                            {roomData.mode !== 'single' && (
                                <div className="mt-3 text-[10px] text-slate-600 bg-slate-50 border border-slate-200 p-2 rounded-lg leading-relaxed font-medium flex-shrink-0">
                                    💡 <strong className="text-fuchsia-600">비밀 유지 중:</strong> 남들이 못 찾은 나만의 단어는 <span className="text-amber-600 font-bold">독점 보너스(2배+5점)</span> 획득!
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 하위 컴포넌트: 결과 화면 ---
        function ResultView({ roomData, user }) {
            const { mode, players } = roomData;
            
            const { ranking, teamScores, wordDetails, totalWordsFound } = useMemo(() => {
                const scores = {};
                Object.keys(players || {}).forEach(uid => scores[uid] = 0);
                
                let teamRedScore = 0;
                let teamBlueScore = 0;

                const details = [];
                const wordsObj = roomData.words || {};
                
                Object.entries(wordsObj).forEach(([word, finders]) => {
                    if (finders.length === 0) return;

                    let baseScore = getLengthBonus(word.length);
                    for (let char of word) baseScore += (LETTER_SCORES[char] || 0);

                    const isExclusive = mode !== 'single' && finders.length === 1;
                    const finalScore = isExclusive ? (baseScore * 2 + 5) : baseScore;

                    finders.forEach(uid => {
                        if (scores[uid] !== undefined) scores[uid] += finalScore;
                        if (mode === 'team') {
                            if (players[uid]?.team === 'red') teamRedScore += finalScore;
                            if (players[uid]?.team === 'blue') teamBlueScore += finalScore;
                        }
                    });

                    details.push({ word, finders, isExclusive, score: finalScore });
                });

                const rankArr = Object.entries(scores).map(([uid, score]) => ({
                    uid,
                    name: players[uid]?.name || '알수없음',
                    team: players[uid]?.team,
                    score
                })).sort((a,b) => b.score - a.score);

                const shuffledDetails = [...details].sort(() => Math.random() - 0.5);

                return { ranking: rankArr, teamScores: { red: teamRedScore, blue: teamBlueScore }, wordDetails: shuffledDetails, totalWordsFound: details.length };
            }, [roomData.players, roomData.words, mode]);

            return (
                <div className="h-full flex flex-col space-y-4 animate-in fade-in duration-700 overflow-y-auto custom-scrollbar pb-4 px-1">
                    <div className="text-center space-y-2 bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm flex-shrink-0">
                        <Sparkles className="w-8 h-8 sm:w-10 sm:h-10 text-amber-500 mx-auto animate-bounce" />
                        <h2 className="text-2xl sm:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-500 via-fuchsia-600 to-indigo-600">
                            {mode === 'single' ? '연성 완료! 내 기록' : mode === '1v1' ? '대결 종료! 승자는?' : '팀 대결 종료!'}
                        </h2>
                    </div>

                    <div className="flex flex-col md:flex-row gap-4 flex-shrink-0">
                        {mode === 'team' && (
                            <div className="flex-1 flex justify-center items-center gap-4 py-2">
                                <div className={`p-4 rounded-2xl border-[3px] flex flex-col items-center w-32 sm:w-40 ${teamScores.red >= teamScores.blue ? 'bg-white border-red-400 shadow-md' : 'bg-slate-50 border-slate-200 opacity-80'}`}>
                                    <Shield className={`w-8 h-8 mb-2 ${teamScores.red >= teamScores.blue ? 'text-red-500' : 'text-slate-400'}`} />
                                    <h3 className={`text-lg font-bold ${teamScores.red >= teamScores.blue ? 'text-red-600' : 'text-slate-500'}`}>레드 팀</h3>
                                    <p className={`text-3xl font-black mt-1 ${teamScores.red >= teamScores.blue ? 'text-slate-800' : 'text-slate-400'}`}>{teamScores.red}</p>
                                </div>
                                <div className="text-xl font-black text-slate-300">VS</div>
                                <div className={`p-4 rounded-2xl border-[3px] flex flex-col items-center w-32 sm:w-40 ${teamScores.blue >= teamScores.red ? 'bg-white border-blue-400 shadow-md' : 'bg-slate-50 border-slate-200 opacity-80'}`}>
                                    <Shield className={`w-8 h-8 mb-2 ${teamScores.blue >= teamScores.red ? 'text-blue-500' : 'text-slate-400'}`} />
                                    <h3 className={`text-lg font-bold ${teamScores.blue >= teamScores.red ? 'text-blue-600' : 'text-slate-500'}`}>블루 팀</h3>
                                    <p className={`text-3xl font-black mt-1 ${teamScores.blue >= teamScores.red ? 'text-slate-800' : 'text-slate-400'}`}>{teamScores.blue}</p>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col min-h-[180px] max-h-[250px] w-full max-w-2xl mx-auto">
                            <h3 className="text-lg font-black flex items-center justify-center mb-4 text-slate-800 flex-shrink-0">
                                <Trophy className="w-5 h-5 mr-2 text-amber-500" /> 종합 순위표
                            </h3>
                            <div className="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-2">
                                {ranking.map((player, idx) => {
                                    const isMe = player.uid === user.uid;
                                    const myExclusiveCount = mode !== 'single' ? wordDetails.filter(w => w.isExclusive && w.finders.includes(player.uid)).length : 0;

                                    return (
                                        <div key={idx} className={`flex items-center justify-between p-3 rounded-xl border ${
                                            idx === 0 ? 'bg-amber-50 border-amber-200 shadow-sm' : 'bg-slate-50 border-slate-200'
                                        } ${isMe ? 'ring-1 ring-fuchsia-400 bg-fuchsia-50/30' : ''}`}>
                                            <div className="flex items-center">
                                                <span className={`w-6 font-black text-base text-center ${idx < 3 ? 'text-amber-500' : 'text-slate-400'}`}>{idx + 1}</span>
                                                {mode === 'team' && (
                                                    <div className={`w-3 h-3 rounded-full mx-2 shadow-sm ${player.team === 'red' ? 'bg-red-500' : 'bg-blue-500'}`} />
                                                )}
                                                <span className={`font-bold text-sm sm:text-base ${isMe ? 'text-indigo-900' : 'text-slate-700'} ${mode !== 'team' && 'ml-2'}`}>
                                                    {player.name}
                                                </span>
                                                {myExclusiveCount > 0 && (
                                                    <span className="ml-2 text-[10px] font-bold bg-fuchsia-100 text-fuchsia-700 px-2 py-0.5 rounded-full border border-fuchsia-200 hidden sm:inline-block">독점 {myExclusiveCount}</span>
                                                )}
                                            </div>
                                            <div className={`font-black text-lg ${idx === 0 ? 'text-amber-600' : 'text-slate-700'}`}>
                                                {player.score} <span className="text-xs font-bold text-slate-400">점</span>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>

                    {mode !== 'single' && (
                        <div className="bg-white rounded-2xl p-4 border border-indigo-100 relative overflow-hidden shadow-sm flex flex-col flex-1 min-h-[150px]">
                            <div className="absolute top-0 right-0 bg-indigo-50 px-3 py-1 rounded-bl-xl text-[10px] font-bold text-indigo-700 border-b border-l border-indigo-100 z-10">☁️ 전체 단어 구름</div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-wrap justify-center content-start gap-x-4 gap-y-2 pt-6 pb-2">
                                {wordDetails.map((w, i) => {
                                    const isMine = w.finders.includes(user.uid);
                                    let sizeClass = w.isExclusive ? 'text-2xl sm:text-3xl font-black z-10' : (w.finders.length > 2 ? 'text-xs opacity-50 font-medium' : 'text-sm sm:text-base font-bold opacity-80');
                                    let colorClass = w.isExclusive ? (isMine ? 'text-amber-500 drop-shadow-sm' : 'text-fuchsia-500 drop-shadow-sm') : 'text-indigo-400';
                                    let extraStyle = w.isExclusive ? { transform: `rotate(${Math.random() * 10 - 5}deg)` } : {};

                                    return (
                                        <span key={i} className={`${sizeClass} ${colorClass} transition-all hover:scale-125 relative group cursor-default`} style={extraStyle}>
                                            {w.word}
                                            <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-white text-slate-800 text-[10px] px-2 py-1 rounded-md border border-slate-200 shadow-lg opacity-0 group-hover:opacity-100 z-20 whitespace-nowrap font-bold transition-opacity">
                                                {w.isExclusive ? '👑 독점! ' : '👥 '}({w.finders.map(id => players[id]?.name.split(' ')[1] || '누군가').join(', ')})
                                            </span>
                                        </span>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                    
                    <div className="text-center pt-2 pb-2 flex-shrink-0">
                         <button onClick={() => window.location.reload()} className="px-8 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-sm transition-colors shadow-md hover:shadow-lg hover:-translate-y-0.5">
                            새 게임 시작하기
                        </button>
                    </div>
                </div>
            );
        }

        // React 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WordAlchemistApp />);
    </script>
</body>
</html>
