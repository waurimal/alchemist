                        {isTeamMode ? (
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white p-3 rounded-lg border border-red-200 shadow-sm">
                                    <div className="text-xs font-bold text-red-600 border-b border-red-100 pb-1 mb-2">🔴 레드 팀</div>
                                    <div className="space-y-1">
                                        {players.filter(([_, p]) => p.team === 'red').map(([uid, p]) => (
                                            <div key={uid} className="text-xs font-bold bg-red-50 text-red-900 p-1.5 rounded">{p.name}</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white p-3 rounded-lg border border-blue-200 shadow-sm">
                                    <div className="text-xs font-bold text-blue-600 border-b border-blue-100 pb-1 mb-2">🔵 블루 팀</div>
                                    <div className="space-y-1">
                                        {players.filter(([_, p]) => p.team === 'blue').map(([uid, p]) => (
                                            <div key={uid} className="text-xs font-bold bg-blue-50 text-blue-900 p-1.5 rounded">{p.name}</div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-wrap gap-2">
                                {players.map(([uid, p]) => (
                                    <span key={uid} className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 shadow-sm">
                                        {p.name} {uid === roomData.hostId && '👑'}
                                    </span>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="flex gap-2 pt-2">
                        <button
                            type="button"
                            onClick={onExit}
                            className="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs"
                        >
                            나가기
                        </button>
                        {isTeamMode && (
                            <button
                                type="button"
                                onClick={handleSwitchTeam}
                                className="px-4 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-bold text-xs border border-indigo-200"
                            >
                                팀 변경
                            </button>
                        )}
                        {isHost ? (
                            <button
                                type="button"
                                onClick={handleStartGame}
                                disabled={roomData.mode === '1v1' && players.length < 2}
                                className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white rounded-xl font-bold text-sm shadow-md flex items-center justify-center gap-1.5"
                            >
                                <i className="fas fa-play"></i> 게임 시작!
                            </button>
                        ) : (
                            <div className="flex-1 py-3 bg-slate-100 text-slate-400 font-bold text-xs rounded-xl flex items-center justify-center animate-pulse">
                                방장이 게임을 시작하기를 기다리는 중...
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ════════════════════════════════════════════════════════════════════
        // ── 6. 게임 매니저 및 플레이 화면 (GameManager, GamePlayView, ResultView) ──
        // ════════════════════════════════════════════════════════════════════
        function GameManager({ roomData, user, appId, onExit }) {
            const [timeLeft, setTimeLeft] = useState(0);

            useEffect(() => {
                if (!roomData.endTime) return;
                const updateTimer = () => {
                    const remaining = Math.max(0, Math.floor((roomData.endTime - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining === 0 && roomData.status === 'playing' && roomData.hostId === user.uid) {
                        updateDoc(doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId), { status: 'finished' });
                    }
                };
                updateTimer();
                const interval = setInterval(updateTimer, 500);
                return () => clearInterval(interval);
            }, [roomData.endTime, roomData.status, roomData.hostId, user.uid, appId, roomData.roomId]);

            if (timeLeft === 0 || roomData.status === 'finished') {
                return <ResultView roomData={roomData} user={user} onExit={onExit} />;
            }
            return <GamePlayView roomData={roomData} user={user} appId={appId} timeLeft={timeLeft} onExit={onExit} />;
        }

        function GamePlayView({ roomData, user, appId, timeLeft, onExit }) {
            const [selectedIndices, setSelectedIndices] = useState([]);
            const [localError, setLocalError] = useState('');
            const [isChecking, setIsChecking] = useState(false);
            const letters = roomData.letters || [];

            // 키보드 A-Z 타이핑, 백스페이스, 엔터 입력 처리
            const handleKeyDown = useCallback((e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key === 'Enter') {
                    if (!isChecking) handleSubmit();
                } else if (e.key === 'Backspace') {
                    setSelectedIndices(prev => prev.slice(0, -1));
                } else if (/^[a-zA-Z]$/.test(e.key)) {
                    const char = e.key.toUpperCase();
                    const availableIndex = letters.findIndex((l, i) => l === char && !selectedIndices.includes(i));
                    if (availableIndex !== -1) {
                        setSelectedIndices(prev => [...prev, availableIndex]);
                    }
                }
            }, [selectedIndices, letters, isChecking]);

            useEffect(() => {
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleKeyDown]);

            const mySubmittedWords = useMemo(() => {
                return Object.entries(roomData.words || {})
                    .filter(([word, finders]) => finders.includes(user.uid))
                    .map(([word]) => word)
                    .reverse();
            }, [roomData.words, user.uid]);

                        const handleSubmit = async () => {
                if (isChecking) return;
                if (selectedIndices.length < 2) {
                    setLocalError("2글자 이상의 단어를 조합하세요!");
                    setTimeout(() => setLocalError(''), 1500);
                    return;
                }
                const rawWord = selectedIndices.map(idx => letters[idx]).join('');
                const cleanWord = rawWord.toUpperCase();
                const lowerWord = rawWord.toLowerCase();

                if (containsProfanity(cleanWord)) {
                    setLocalError("금지어/비속어는 연성할 수 없습니다! 🚫");
                    setSelectedIndices([]);
                    setTimeout(() => setLocalError(''), 1500);
                    return;
                }
                if (mySubmittedWords.includes(cleanWord)) {
                    setLocalError("이미 연성한 단어입니다!");
                    setSelectedIndices([]);
                    setTimeout(() => setLocalError(''), 1500);
                    return;
                }

                setIsChecking(true);
                let isValidWord = false;
                let fetchedMeaning = roomData.meanings?.[cleanWord] || "";

                if (fetchedMeaning || (roomData.words && roomData.words[cleanWord])) {
                    isValidWord = true;
                } else if (COMMON_WORDS_DB.has(cleanWord)) {
                    isValidWord = true;
                } else {
                    setLocalError("마법 사전 검증 중... 🔍");
                    try {
                        // 1차 초고속 Datamuse API (1.2초 타임아웃)
                        const ctrl1 = new AbortController();
                        const to1 = setTimeout(() => ctrl1.abort(), 1200);
                        const res = await fetch(`https://api.datamuse.com/words?sp=${lowerWord}&max=1`, { signal: ctrl1.signal });
                        clearTimeout(to1);
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.length > 0 && data[0].word && data[0].word.toLowerCase() === lowerWord) {
                                isValidWord = true;
                            }
                        }
                    } catch (dmErr) {}

                    // 2차 Dictionary API fallback (1.2초 타임아웃)
                    if (!isValidWord) {
                        try {
                            const ctrl2 = new AbortController();
                            const to2 = setTimeout(() => ctrl2.abort(), 1200);
                            const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${lowerWord}`, { signal: ctrl2.signal });
                            clearTimeout(to2);
                            if (dictRes.ok) {
                                isValidWord = true;
                            }
                        } catch (dictErr) {}
                    }

                    if (isValidWord) {
                        // 한 번 검증된 단어는 즉시 로컬 메모리에 영구 등록
                        COMMON_WORDS_DB.add(cleanWord);
                        // Firestore 전역 사전에도 비동기 백그라운드 저장 (UI 블로킹 방지)
                        try {
                            const dictRef = doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'global_dictionary');
                            updateDoc(dictRef, { words: arrayUnion(cleanWord) }).catch(() => {
                                setDoc(dictRef, { words: [cleanWord] }, { merge: true }).catch(() => {});
                            });
                        } catch (e) {}
                    }
                }

                if (!isValidWord) {
                    setLocalError("존재하지 않는 영단어입니다! ❌");
                    setTimeout(() => setLocalError(''), 1500);
                    setIsChecking(false);
                    return;
                }

                // 한국어 뜻 비동기 조회 (800ms 타임아웃 걸어 단어 제출 지연 절대 방지)
                if (!fetchedMeaning) {
                    try {
                        const transCtrl = new AbortController();
                        const transTo = setTimeout(() => transCtrl.abort(), 800);
                        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(lowerWord)}`, { signal: transCtrl.signal });
                        clearTimeout(transTo);
                        if (transRes.ok) {
                            const transData = await transRes.json();
                            fetchedMeaning = transData?.[0]?.[0]?.[0] || "";
                        }
                    } catch (e) {}
                }

                try {
                    const updatePayload = { [`words.${cleanWord}`]: arrayUnion(user.uid) };
                    if (fetchedMeaning && !roomData.meanings?.[cleanWord]) {
                        updatePayload[`meanings.${cleanWord}`] = fetchedMeaning;
                    }
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId), updatePayload);
                    setSelectedIndices([]);
                    setLocalError('');
                } catch (err) {
                    console.error("단어 제출 에러:", err);
                    setLocalError("단어 제출 중 네트워크 오류가 발생했습니다.");
                    setTimeout(() => setLocalError(''), 1500);
                } finally {
                    setIsChecking(false);
                }
            };

            const currentBaseScore = selectedIndices.reduce((acc, idx) => acc + (LETTER_SCORES[letters[idx]] || 0), 0) + getLengthBonus(selectedIndices.length);

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    {/* [좌측/중앙]: 타이머, 조합대, 알파벳 16개 타일 */}
                    <div className="lg:col-span-2 space-y-3">
                        {/* 상단 타이머 및 진행 상태 */}
                        <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span className="text-xl">⏱️</span>
                                <span className="text-xs font-bold text-slate-500">남은 시간</span>
                            </div>
                            <div className={`text-2xl font-black font-mono tracking-wider ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-indigo-600'}`}>
                                {Math.floor(timeLeft / 60)}:{String(timeLeft % 60).padStart(2, '0')}
                            </div>
                        </div>

                        {/* 마법 조합대 */}
                        <div className="bg-white rounded-2xl border border-indigo-100 p-4 shadow-sm flex flex-col items-center justify-center min-h-[140px] relative">
                            <span className="absolute top-2 left-3 text-[11px] font-extrabold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
                                🔮 마법 조합대
                            </span>

                            <div className="flex justify-center items-center flex-wrap gap-2 w-full my-3 min-h-[48px]">
                                {selectedIndices.length === 0 ? (
                                    <span className="text-xs font-bold text-slate-400">타일을 클릭하거나 키보드로 입력하세요...</span>
                                ) : (
                                    selectedIndices.map((idx, pos) => (
                                        <button
                                            key={pos}
                                            type="button"
                                            onClick={() => setSelectedIndices(prev => prev.filter((_, i) => i !== pos))}
                                            className="orb-chip w-10 h-12 text-xl flex items-center justify-center"
                                            title="클릭 시 제거"
                                        >
                                            {letters[idx]}
                                        </button>
                                    ))
                                )}
                            </div>

                            <div className="h-5 flex items-center justify-center text-xs font-bold mb-2">
                                {localError ? (
                                    <span className="text-red-500 animate-pulse">{localError}</span>
                                ) : selectedIndices.length > 0 ? (
                                    <span className="text-amber-600 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                                        예상 {currentBaseScore}점 연성
                                    </span>
                                ) : null}
                            </div>

                            <div className="flex gap-2 w-full max-w-xs">
                                <button
                                    type="button"
                                    onClick={() => setSelectedIndices(prev => prev.slice(0, -1))}
                                    disabled={selectedIndices.length === 0 || isChecking}
                                    className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 rounded-xl font-bold text-xs"
                                >
                                    지우기
                                </button>
                                <button
                                    type="button"
                                    onClick={handleSubmit}
                                    disabled={selectedIndices.length < 2 || isChecking}
                                    className="flex-2 py-2 px-6 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 disabled:opacity-50 text-slate-900 rounded-xl font-black text-xs shadow-md flex items-center justify-center gap-1.5"
                                >
                                    <i className="fas fa-wand-magic-sparkles"></i> {isChecking ? '검색 중...' : '연성하기 (Enter)'}
                                </button>
                            </div>
                        </div>

                        {/* 16개 마법 알파벳 타일 그리드 */}
                        <div className="bg-slate-100/80 p-3 rounded-2xl border border-slate-200 shadow-inner">
                            <div className="grid grid-cols-8 gap-2">
                                {letters.map((char, i) => {
                                    const isUsed = selectedIndices.includes(i);
                                    return (
                                        <button
                                            key={i}
                                            type="button"
                                            disabled={isUsed}
                                            onClick={() => setSelectedIndices(prev => [...prev, i])}
                                            className={`magic-tile h-14 flex items-center justify-center text-xl ${isUsed ? 'opacity-40' : ''}`}
                                        >
                                            <span>{char}</span>
                                            {!isUsed && (
                                                <span className="absolute bottom-1 right-1.5 text-[9px] font-bold text-slate-400">
                                                    {LETTER_SCORES[char]}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* [우측]: 연성 일지 */}
                    <div className="space-y-3">
                        <div className="alch-card h-full flex flex-col p-4">
                            <div className="flex justify-between items-center pb-2.5 mb-2 border-b border-slate-100">
                                <span className="font-extrabold text-xs text-slate-800 flex items-center gap-1.5">
                                    <i className="fas fa-book-open text-indigo-600"></i> 내가 연성한 일지
                                </span>
                                <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-bold text-xs">
                                    {mySubmittedWords.length}개
                                </span>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 max-h-[420px]">
                                {mySubmittedWords.length === 0 ? (
                                    <div className="text-center py-16 text-slate-400 text-xs font-bold">
                                        아직 연성된 단어가 없습니다.<br />새로운 마법 단어를 만들어 보세요!
                                    </div>
                                ) : (
                                    mySubmittedWords.map((w, idx) => {
                                        const score = getLengthBonus(w.length) + w.split('').reduce((a, c) => a + (LETTER_SCORES[c] || 0), 0);
                                        return (
                                            <div key={idx} className="p-2 bg-slate-50 border border-slate-200 rounded-xl">
                                                <div className="flex justify-between items-center mb-0.5">
                                                    <span className="font-black text-slate-800 text-xs">{w}</span>
                                                    <span className="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">
                                                        +{score}점
                                                    </span>
                                                </div>
                                                {roomData.meanings?.[w] && (
                                                    <div className="text-[11px] text-slate-500 font-medium truncate">
                                                        {roomData.meanings[w]}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ResultView({ roomData, user, onExit }) {
            const { ranking, teamScores, wordDetails } = useMemo(() => {
                const scores = {};
                Object.keys(roomData.players || {}).forEach(uid => scores[uid] = 0);
                let tRed = 0, tBlue = 0;
                const details = [];

                Object.entries(roomData.words || {}).forEach(([word, finders]) => {
                    if (!finders || finders.length === 0) return;
                    const bScore = getLengthBonus(word.length) + word.split('').reduce((a, c) => a + (LETTER_SCORES[c] || 0), 0);
                    const isEx = roomData.mode !== 'single' && finders.length === 1;
                    const fScore = isEx ? (bScore * 2 + 5) : bScore;

                    finders.forEach(uid => {
                        if (scores[uid] !== undefined) scores[uid] += fScore;
                        if (roomData.mode === 'team') {
                            roomData.players?.[uid]?.team === 'red' ? tRed += fScore : tBlue += fScore;
                        }
                    });

                    details.push({ word, finders, isExclusive: isEx, score: fScore });
                });

                return {
                    ranking: Object.entries(scores).map(([uid, s]) => ({
                        uid,
                        name: roomData.players?.[uid]?.name || '연금술사',
                        team: roomData.players?.[uid]?.team,
                        score: s
                    })).sort((a, b) => b.score - a.score),
                    teamScores: { red: tRed, blue: tBlue },
                    wordDetails: details.sort(() => Math.random() - 0.5)
                };
            }, [roomData.players, roomData.words, roomData.mode]);

            return (
                <div className="alch-card max-w-3xl mx-auto w-full space-y-4 animate-in zoom-in-95">
                    <div className="text-center py-2">
                        <span className="text-4xl block mb-1">🏆</span>
                        <h2 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-500 to-indigo-600">
                            연금술 대결 종료!
                        </h2>
                    </div>

                    {roomData.mode === 'team' ? (
                        <div className="grid grid-cols-2 gap-3">
                            <div className={`p-4 rounded-2xl border-2 text-center ${teamScores.red >= teamScores.blue ? 'bg-red-50 border-red-400' : 'bg-white border-slate-200'}`}>
                                <h3 className="text-xs font-bold text-red-600 mb-1">🔴 레드 팀</h3>
                                <p className="text-3xl font-black text-slate-800">{teamScores.red}점</p>
                            </div>
                            <div className={`p-4 rounded-2xl border-2 text-center ${teamScores.blue >= teamScores.red ? 'bg-blue-50 border-blue-400' : 'bg-white border-slate-200'}`}>
                                <h3 className="text-xs font-bold text-blue-600 mb-1">🔵 블루 팀</h3>
                                <p className="text-3xl font-black text-slate-800">{teamScores.blue}점</p>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar p-2 bg-slate-50 rounded-xl border border-slate-200">
                            {ranking.map((p, idx) => (
                                <div key={idx} className={`flex justify-between items-center p-2.5 rounded-xl border ${idx === 0 ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}`}>
                                    <div className="flex items-center gap-2">
                                        <span className={`w-6 font-black text-sm text-center ${idx < 3 ? 'text-amber-500' : 'text-slate-400'}`}>
                                            {idx + 1}
                                        </span>
                                        <span className="font-bold text-xs text-slate-800">{p.name}</span>
                                    </div>
                                    <span className="font-black text-sm text-indigo-600">{p.score}점</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 연성된 전체 단어 */}
                    {wordDetails.length > 0 && (
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                            <span className="text-xs font-bold text-slate-600 block mb-2">
                                📖 대결 중 연성된 단어 ({wordDetails.length}개)
                            </span>
                            <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto custom-scrollbar">
                                {wordDetails.map((w, i) => (
                                    <span
                                        key={i}
                                        className={`px-2 py-1 rounded-lg text-xs font-bold border ${w.isExclusive ? 'bg-amber-100 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-700'}`}
                                        title={roomData.meanings?.[w.word] || ''}
                                    >
                                        {w.isExclusive && '👑 '}{w.word} (+{w.score}점)
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="text-center pt-2">
                        <button
                            type="button"
                            onClick={onExit}
                            className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs shadow-md"
                        >
                            로비로 돌아가기
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WordAlchemistApp />);
    </script>
</body>
</html>
