<body>
    <div id="root"></div>

    <!-- 설정한 react-classic 프리셋을 적용 -->
    <script type="text/babel" data-type="module" data-presets="react-classic">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useCallback } = React;

        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            firebaseConfig = {
                apiKey: "AIzaSyAeKjzEWOvqmP4hYRM_NEZY1GEZ1reerAI",
                authDomain: "alchemist-ef277.firebaseapp.com",
                projectId: "alchemist-ef277",
                storageBucket: "alchemist-ef277.firebasestorage.app",
                messagingSenderId: "485393554873",
                appId: "1:485393554873:web:6cff9040cd70453d716a68",
                measurementId: "G-CF71EZ2L7N"
            };
        }
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'word-alchemist-local';
        const ROOMS_COLLECTION = 'word_alchemist_rooms';
        const SETTINGS_COLLECTION = 'word_alchemist_settings'; 

        const Icon = ({ path, className, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style} dangerouslySetInnerHTML={{ __html: path }} />
        );
        const Wand2 = (p) => <Icon {...p} path='<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>' />;
        const AlertCircle = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' />;
        const Flame = (p) => <Icon {...p} path='<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>' />;
        const User = (p) => <Icon {...p} path='<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' />;
        const Swords = (p) => <Icon {...p} path='<polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="10"/><line x1="4" y1="16" x2="8" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/>' />;
        const Users2 = (p) => <Icon {...p} path='<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' />;
        const ArrowRight = (p) => <Icon {...p} path='<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>' />;
        const Shield = (p) => <Icon {...p} path='<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' />;
        const Clock = (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' />;
        const BookOpen = (p) => <Icon {...p} path='<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' />;
        const Sparkles = (p) => <Icon {...p} path='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>' />;
        const Play = (p) => <Icon {...p} path='<polygon points="5 3 19 12 5 21 5 3"/>' />;
        const Trophy = (p) => <Icon {...p} path='<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' />;
        const Settings = (p) => <Icon {...p} path='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>' />;

        const LETTER_SCORES = { A:1, E:1, I:1, O:1, U:1, L:1, N:1, S:1, T:1, R:1, D:2, G:2, B:3, C:3, M:3, P:3, F:4, H:4, V:4, W:4, Y:4, K:5, J:8, X:8, Q:10, Z:10 };
        const PROFANITY_LIST = ["시발", "씨발", "병신", "새끼", "지랄", "존나", "섹스", "느금", "애미", "애비", "개새", "FUCK", "SHIT", "BITCH", "CUNT", "DICK", "ASS", "SEX", "PORN", "SLUT"];
        
        const getLengthBonus = (length) => {
            if (length <= 3) return 0;
            if (length === 4) return 2;
            if (length === 5) return 5;
            if (length === 6) return 8;
            return 12; 
        };

        const generateLetters = () => {
            const vowels = 'AAAAEEEEIIIOOOUU'.split('');
            const consonants = 'BBCCDDFFGGHHJKLLMMNNPPRRSSTTVVWWXYYZ'.split('');
            const letters = [];
            for(let i=0; i<6; i++) letters.push(vowels[Math.floor(Math.random() * vowels.length)]);
            for(let i=0; i<10; i++) letters.push(consonants[Math.floor(Math.random() * consonants.length)]);
            return letters.sort(() => Math.random() - 0.5);
        };
        const generateRoomCode = () => Math.floor(1000 + Math.random() * 9000).toString();
        const containsProfanity = (text) => PROFANITY_LIST.some(badWord => text.toUpperCase().includes(badWord));
        
        // 빠른 검증을 위한 초경량 내장 사전 (빈출 단어)
        const COMMON_WORDS_DB = new Set(["THE", "BE", "TO", "OF", "AND", "A", "IN", "THAT", "HAVE", "I", "IT", "FOR", "NOT", "ON", "WITH", "HE", "AS", "YOU", "DO", "AT", "THIS", "BUT", "HIS", "BY", "FROM", "THEY", "WE", "SAY", "HER", "SHE", "OR", "AN", "WILL", "MY", "ONE", "ALL", "WOULD", "THERE", "THEIR", "WHAT", "SO", "UP", "OUT", "IF", "ABOUT", "WHO", "GET", "WHICH", "GO", "ME", "WHEN", "MAKE", "CAN", "LIKE", "TIME", "NO", "JUST", "HIM", "KNOW", "TAKE", "PEOPLE", "INTO", "YEAR", "YOUR", "GOOD", "SOME", "COULD", "THEM", "SEE", "OTHER", "THAN", "THEN", "NOW", "LOOK", "ONLY", "COME", "ITS", "OVER", "THINK", "ALSO", "BACK", "AFTER", "USE", "TWO", "HOW", "OUR", "WORK", "FIRST", "WELL", "WAY", "EVEN", "NEW", "WANT", "BECAUSE", "ANY", "THESE", "GIVE", "DAY", "MOST", "US", "NET", "APPLE", "BANANA", "CAT", "DOG", "CAR", "RED", "BLUE", "GREEN", "TREE", "BOOK", "WATER", "FIRE", "EARTH", "AIR", "SUN", "MOON", "STAR", "BOY", "GIRL", "MAN", "WOMAN", "HOUSE", "SCHOOL", "FRIEND", "LOVE", "HAPPY", "SAD", "RUN", "WALK", "JUMP", "SWIM", "FLY", "EAT", "DRINK", "SLEEP", "WAKE"]);

        function WordAlchemistApp() {
            const [user, setUser] = useState(null);
            const [roomId, setRoomId] = useState('');
            const [roomData, setRoomData] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [isJoining, setIsJoining] = useState(false);
            const [showHallOfFame, setShowHallOfFame] = useState(false);

            const [userInfo, setUserInfo] = useState({ grade: '', classNum: '', studentNum: '', name: '' });
            const [selectedMode, setSelectedMode] = useState(null); 

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setErrorMsg("인증에 실패했습니다.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !roomId || isJoining) return;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomId);
                const unsubscribe = onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setRoomData(docSnap.data());
                    } else {
                        setErrorMsg("방이 사라졌거나 존재하지 않습니다.");
                        setRoomId('');
                        setRoomData(null);
                    }
                }, (error) => {
                    console.error("Listen Error:", error);
                    setErrorMsg("데이터를 불러오는데 문제가 발생했습니다.");
                });

                return () => unsubscribe();
            }, [user, roomId, isJoining]);

            const handleCreateRoom = async (mode, timeLimit = 90, isTeacher = false) => {
                if (!user) return;
                const displayName = isTeacher ? "👨‍🏫 선생님" : `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${userInfo.name}`;
                if (containsProfanity(displayName)) return setErrorMsg("부적절한 이름이 포함되어 방을 생성할 수 없습니다.");

                const newRoomId = mode === 'single' ? `SINGLE_${user.uid.slice(0,6)}` : generateRoomCode();
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, newRoomId);
                
                try {
                    const initialData = {
                        roomId: newRoomId,
                        hostId: user.uid,
                        status: mode === 'single' ? 'playing' : 'waiting', 
                        mode: mode,
                        timeLimit: timeLimit,
                        letters: generateLetters(),
                        endTime: mode === 'single' ? Date.now() + timeLimit * 1000 : null,
                        players: {
                            [user.uid]: { name: displayName, team: 'red', isTeacher: isTeacher }
                        },
                        words: {},
                        meanings: {}
                    };
                    await setDoc(roomRef, initialData);
                    setRoomId(newRoomId);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 생성에 실패했습니다.");
                    console.error(err);
                }
            };

            const handleJoinRoom = async (codeToJoin) => {
                if (!codeToJoin || codeToJoin.length !== 4) return setErrorMsg("올바른 4자리 방 코드를 입력하세요.");
                if (!user) return;

                setIsJoining(true);
                const displayName = `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${userInfo.name}`;
                if (containsProfanity(displayName)) {
                    setErrorMsg("부적절한 이름이 포함되어 방에 입장할 수 없습니다.");
                    setIsJoining(false);
                    return;
                }

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, codeToJoin);
                try {
                    const docSnap = await getDoc(roomRef);
                    if (!docSnap.exists()) {
                        setErrorMsg("존재하지 않는 방입니다.");
                        setIsJoining(false);
                        return;
                    }
                    const data = docSnap.data();

                    if (data.players[user.uid]) {
                        setErrorMsg("이미 이 방에 접속해 있습니다. (테스트하려면 새 시크릿 창을 이용하세요)");
                        setIsJoining(false);
                        return;
                    }

                    if (data.status !== 'waiting') {
                        setErrorMsg("이미 게임이 시작되었거나 종료되었습니다.");
                        setIsJoining(false);
                        return;
                    }
                    if (data.mode === '1v1' && Object.keys(data.players).length >= 2) {
                        setErrorMsg("1:1 대결 방은 이미 꽉 찼습니다.");
                        setIsJoining(false);
                        return;
                    }

                    let assignedTeam = 'blue';
                    if (data.mode === 'team') {
                        const redCount = Object.values(data.players).filter(p => p.team === 'red').length;
                        const blueCount = Object.values(data.players).filter(p => p.team === 'blue').length;
                        assignedTeam = redCount > blueCount ? 'blue' : 'red';
                    }

                    await updateDoc(roomRef, {
                        [`players.${user.uid}`]: { name: displayName, team: assignedTeam, isTeacher: false }
                    });

                    setRoomId(codeToJoin);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 참가에 실패했습니다.");
                } finally {
                    setIsJoining(false);
                }
            };

            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-50 text-indigo-800">
                        <Wand2 className="w-10 h-10 animate-spin text-fuchsia-600 mr-3" />
                        <h1 className="text-2xl font-bold">마나를 모으는 중...</h1>
                    </div>
                );
            }

            return (
                <div className="h-screen overflow-hidden flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-fuchsia-200 selection:text-fuchsia-900 relative">
                    <header className="bg-white/80 border-b border-slate-200 py-2 px-4 shadow-sm backdrop-blur-md flex-shrink-0 z-20">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-2 text-fuchsia-600">
                                <Flame className="w-5 h-5" />
                                <h1 className="text-lg font-black tracking-wider">단어 연금술사</h1>
                            </div>
                            <div className="flex items-center space-x-3">
                                {userInfo.name && !roomData && !showHallOfFame && (
                                    <button onClick={() => setShowHallOfFame(true)} className="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200 shadow-sm hover:bg-amber-100 transition-colors">
                                        <Trophy className="w-3.5 h-3.5 mr-1" /> 명예의 전당
                                    </button>
                                )}
                                {userInfo.name && (
                                    <div className="text-xs text-slate-500 font-medium hidden sm:block">
                                        <span className="font-bold text-indigo-600">{userInfo.name}</span> 연금술사
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden w-full max-w-5xl mx-auto p-2 md:p-3 flex flex-col relative z-10">
                        {errorMsg && (
                            <div className="mb-2 p-2 bg-red-50 border border-red-200 rounded-lg flex items-center text-red-600 animate-in slide-in-from-top-2 shadow-sm flex-shrink-0 text-sm">
                                <AlertCircle className="w-4 h-4 mr-2 flex-shrink-0" />
                                <span className="font-medium">{errorMsg}</span>
                                <button onClick={() => setErrorMsg('')} className="ml-auto text-red-400 hover:text-red-600">✕</button>
                            </div>
                        )}

                        {showHallOfFame ? (
                            <HallOfFameView onBack={() => setShowHallOfFame(false)} db={db} appId={appId} />
                        ) : !roomData ? (
                            <LobbyView 
                                userInfo={userInfo} setUserInfo={setUserInfo}
                                selectedMode={selectedMode} setSelectedMode={setSelectedMode}
                                onCreateRoom={handleCreateRoom} onJoinRoom={handleJoinRoom} 
                                db={db} appId={appId}
                            />
                        ) : roomData.status === 'waiting' ? (
                            <WaitingRoomView roomData={roomData} user={user} appId={appId} />
                        ) : (
                            <GameManager roomData={roomData} user={user} appId={appId} />
                        )}
                    </main>
                    
                    <footer className="py-2 flex-shrink-0 text-center bg-transparent z-10">
                        <p className="text-[10px] text-slate-400 font-medium">만든이: 곽현석(이의초등학교)</p>
                        <p className="text-[10px] text-slate-400">Copyright © 2026 Eui Elementary School. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        }

        function LobbyView({ userInfo, setUserInfo, selectedMode, setSelectedMode, onCreateRoom, onJoinRoom, db, appId }) {
            const [joinCode, setJoinCode] = useState('');
            const [isTeacherMenu, setIsTeacherMenu] = useState(false);
            const [teacherConfig, setTeacherConfig] = useState({ mode: 'class', timeLimit: 90 });
            
            const [dbTeacherPwd, setDbTeacherPwd] = useState("1234");
            const [pwdInput, setPwdInput] = useState('');
            const [isPwdChecked, setIsPwdChecked] = useState(false);
            const [newPwdInput, setNewPwdInput] = useState('');
            const [delGrade, setDelGrade] = useState('');
            const [delClass, setDelClass] = useState('');

            const [teacherTab, setTeacherTab] = useState('settings'); 
            const [studentRecords, setStudentRecords] = useState([]);
            const [recordLoading, setRecordLoading] = useState(false);
            const [filterRecGrade, setFilterRecGrade] = useState('');
            const [filterRecClass, setFilterRecClass] = useState('');

            useEffect(() => {
                const fetchPwd = async () => {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'teacher_config');
                        const snap = await getDoc(docRef);
                        if (snap.exists() && snap.data().password) {
                            setDbTeacherPwd(snap.data().password);
                        }
                    } catch (e) { console.error("비밀번호 로드 실패:", e); }
                };
                fetchPwd();
            }, [db, appId]);

            const isInfoComplete = userInfo.grade && userInfo.classNum && userInfo.studentNum && userInfo.name.trim();

            const handleInfoChange = (e) => {
                const { name, value } = e.target;
                setUserInfo(prev => ({ ...prev, [name]: value }));
            };

            const handleTeacherMenuOpen = () => { setIsTeacherMenu(true); setIsPwdChecked(false); setPwdInput(''); setTeacherTab('settings'); };

            const handleChangePwd = async () => {
                if(!newPwdInput.trim()) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'teacher_config');
                    await setDoc(docRef, { password: newPwdInput.trim() }, { merge: true });
                    setDbTeacherPwd(newPwdInput.trim());
                    alert("비밀번호가 변경되었습니다.");
                    setNewPwdInput('');
                } catch (e) { alert("비밀번호 변경에 실패했습니다."); }
            };

            const handleDeleteClassData = async () => {
                if(!delGrade || !delClass) return alert('학년과 반을 모두 입력해주세요.');
                if(!confirm(`정말 ${delGrade}학년 ${delClass}반 방장이 만든 대결 및 순위 기록을 삭제하시겠습니까? (복구 불가)`)) return;
                
                try {
                    const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    let count = 0;
                    snapshot.forEach((docSnap) => {

                            count++;
                        }
                    });
                    alert(`${count}개의 대결 기록이 성공적으로 삭제되었습니다.`);

            const loadStudentRecords = async () => {
                setRecordLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    const scoresByName = {};
                    
                    snapshot.forEach((docSnap) => {
                        const room = docSnap.data();
                        if (room.status !== 'finished') return;
                        
                        Object.entries(room.players || {}).forEach(([uid, p]) => {
                            if (!p.isTeacher && !scoresByName[p.name]) {
                                scoresByName[p.name] = { name: p.name, score: 0 };
                            }
                        });

                        Object.entries(room.words || {}).forEach(([word, finders]) => {
                            if (finders.length === 0) return;
                            let bScore = getLengthBonus(word.length) + word.split('').reduce((a,c)=>a+(LETTER_SCORES[c]||0),0);
                            const isEx = room.mode !== 'single' && finders.length === 1;
                            const fScore = isEx ? (bScore * 2 + 5) : bScore;

                            finders.forEach(uid => {
                                const p = room.players[uid];
                                if (p && !p.isTeacher && scoresByName[p.name]) {
                                    scoresByName[p.name].score += fScore;
                                }
                            });
                        });
                    });
                    setStudentRecords(Object.values(scoresByName).sort((a,b)=>b.score - a.score));

        function GameManager({ roomData, user, appId }) {
            const [timeLeft, setTimeLeft] = useState(0);

            useEffect(() => {
                if (!roomData.endTime) return;
                const updateTimer = () => {
                    const remaining = Math.max(0, Math.floor((roomData.endTime - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining === 0 && roomData.status === 'playing' && roomData.hostId === user.uid) {
                        updateDoc(doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId), { status: 'finished' });
                    }
                };
                updateTimer();
                const interval = setInterval(updateTimer, 500);
                return () => clearInterval(interval);
            }, [roomData.endTime, roomData.status, roomData.hostId, user.uid, appId, roomData.roomId]);

            if (timeLeft === 0 || roomData.status === 'finished') return <ResultView roomData={roomData} user={user} />;
            return <GamePlayView roomData={roomData} user={user} appId={appId} timeLeft={timeLeft} />;
        }

        function GamePlayView({ roomData, user, appId, timeLeft }) {
            const [selectedIndices, setSelectedIndices] = useState([]);
            const [localError, setLocalError] = useState('');
            const [isChecking, setIsChecking] = useState(false);
            const letters = roomData.letters || [];

            const handleKeyDown = useCallback((e) => {
                if (e.key === 'Enter') { if (!isChecking) handleSubmit(); }
                else if (e.key === 'Backspace') setSelectedIndices(prev => prev.slice(0, -1));
                else if (/^[a-zA-Z]$/.test(e.key)) {
                    const char = e.key.toUpperCase();
                    const availableIndex = letters.findIndex((l, i) => l === char && !selectedIndices.includes(i));
                    if (availableIndex !== -1) setSelectedIndices(prev => [...prev, availableIndex]);
                }
            }, [selectedIndices, letters, isChecking]);

            useEffect(() => { window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown); }, [handleKeyDown]);

            const mySubmittedWords = useMemo(() => Object.entries(roomData.words || {}).filter(([word, finders]) => finders.includes(user.uid)).map(([word]) => word).reverse(), [roomData.words, user.uid]);

            const handleSubmit = async () => {
                if (isChecking) return;
                if (selectedIndices.length < 2) { setLocalError("2글자 이상 입력하세요!"); setTimeout(()=>setLocalError(''), 1500); return; }
                const cleanWord = selectedIndices.map(idx => letters[idx]).join('');
                if (containsProfanity(cleanWord)) { setLocalError("금지어 차단 🚫"); setSelectedIndices([]); setTimeout(()=>setLocalError(''), 1500); return; }
                if (mySubmittedWords.includes(cleanWord)) { setLocalError("이미 연성한 단어입니다!"); setSelectedIndices([]); setTimeout(()=>setLocalError(''), 1500); return; }

                setIsChecking(true);
                let isValidWord = false;
                let fetchedMeaning = roomData.meanings?.[cleanWord] || "";

                if (fetchedMeaning || (roomData.words && roomData.words[cleanWord])) isValidWord = true;
                else {
                    setLocalError("검색 중... 🔍");
                    try {
                        if (COMMON_WORDS_DB.has(cleanWord)) isValidWord = true;
                        else {
                            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
                            if (res.ok) { isValidWord = true; COMMON_WORDS_DB.add(cleanWord); }
                        }
                        if (isValidWord && !fetchedMeaning) {
                            const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${cleanWord}`);
                            if (transRes.ok) { const transData = await transRes.json(); fetchedMeaning = transData[0][0][0]; }
                        }
                    } catch (err) { isValidWord = COMMON_WORDS_DB.has(cleanWord); }
                }

                if (!isValidWord) { setLocalError("없는 단어입니다! ❌"); setTimeout(()=>setLocalError(''), 1500); setIsChecking(false); return; }

                try {
                    const updatePayload = { [`words.${cleanWord}`]: arrayUnion(user.uid) };
                    if (fetchedMeaning && !roomData.meanings?.[cleanWord]) updatePayload[`meanings.${cleanWord}`] = fetchedMeaning;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId), updatePayload);
                    setSelectedIndices([]); setLocalError('');
                } catch (err) {} finally { setIsChecking(false); }
            };

            const currentBaseScore = selectedIndices.reduce((acc, idx) => acc + (LETTER_SCORES[letters[idx]] || 0), 0) + getLengthBonus(selectedIndices.length);

                            <div className="flex-1 flex justify-center content-center flex-wrap gap-1.5 w-full mt-4 overflow-y-auto custom-scrollbar">
                                {selectedIndices.length === 0 ? <div className="text-slate-400 text-xs flex items-center border-b border-dashed px-2">입력...</div> : 
                                    selectedIndices.map((idx, pos) => <button key={pos} onClick={() => setSelectedIndices(prev => prev.filter((_, i) => i !== pos))} className="w-8 h-10 sm:w-10 sm:h-12 bg-indigo-600 text-white rounded-lg flex justify-center items-center text-xl font-black shadow-[0_3px_0_rgb(67,56,202)] hover:bg-red-500 hover:-translate-y-0.5">{letters[idx]}</button>)}
                            </div>
                            <div className="h-4 mb-2 flex-shrink-0 flex items-center text-[10px]">
                                {localError ? <span className="text-red-500 font-bold animate-pulse">{localError}</span> : (selectedIndices.length > 0 && <span className="text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">예상 {currentBaseScore}점</span>)}
                            </div>
                            <div className="flex gap-2 w-full max-w-xs flex-shrink-0">
                                <button onClick={() => setSelectedIndices(prev => prev.slice(0, -1))} disabled={selectedIndices.length === 0 || isChecking} className="flex-1 py-1.5 bg-slate-100 text-slate-700 rounded-lg font-bold text-xs">지우기</button>
                                <button onClick={handleSubmit} disabled={selectedIndices.length < 2 || isChecking} className="flex-[2] py-1.5 bg-amber-400 text-slate-900 rounded-lg font-bold flex justify-center items-center text-xs shadow-[0_2px_0_rgb(217,119,6)]"><Wand2 className="w-3 h-3 mr-1"/> {isChecking?'검색중':'연성'}</button>
                            </div>
                        </div>

                        <div className="bg-slate-100 p-2 rounded-2xl border border-slate-200 text-center flex-shrink-0 shadow-inner">
                            <div className="flex flex-wrap justify-center gap-1">
                                {letters.map((char, i) => {
                                    const isUsed = selectedIndices.includes(i);
                                    return <button key={i} onClick={() => {if(!isUsed) setSelectedIndices(prev=>[...prev, i])}} disabled={isUsed} className={`relative w-8 h-10 rounded-lg flex items-center justify-center text-lg font-bold ${isUsed ? 'bg-slate-200 text-slate-400 scale-95' : 'bg-white text-slate-800 shadow-[0_2px_0_rgb(203,213,225)] hover:bg-indigo-50 border border-slate-300'}`}>{char}{!isUsed && <span className="absolute bottom-0 right-1 text-[8px] opacity-50">{LETTER_SCORES[char]}</span>}</button>
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="lg:w-48 xl:w-64 flex-shrink-0 h-full flex flex-col">
                        <div className="bg-white rounded-2xl p-3 h-full border border-slate-200 flex flex-col shadow-sm">
                            <h3 className="text-xs font-bold text-slate-800 flex items-center mb-2 pb-2 border-b border-slate-100"><BookOpen className="w-3 h-3 mr-1 text-indigo-500" /> 연성 일지 <span className="ml-auto bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-full">{mySubmittedWords.length}개</span></h3>
                            <div className="flex-1 overflow-y-auto pr-1 space-y-1.5 custom-scrollbar">
                                {mySubmittedWords.map((word, idx) => (
                                    <div key={idx} className="flex flex-col bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                                        <div className="flex justify-between items-center"><span className="font-black text-slate-700 text-xs">{word}</span><span className="text-[9px] font-bold text-amber-600 bg-amber-50 px-1 rounded">{getLengthBonus(word.length) + word.split('').reduce((a,c)=>a+(LETTER_SCORES[c]||0),0)}점</span></div>
                                        {roomData.meanings?.[word] && <div className="text-[9px] text-slate-500 leading-tight truncate mt-0.5">{roomData.meanings[word]}</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                const scores = {}; Object.keys(roomData.players || {}).forEach(uid => scores[uid] = 0);

                    const fScore = isEx ? (bScore * 2 + 5) : bScore;
                    finders.forEach(uid => {
                        if (scores[uid] !== undefined) scores[uid] += fScore;
                        if (roomData.mode === 'team') { roomData.players[uid]?.team === 'red' ? tRed += fScore : tBlue += fScore; }
                    });
                    details.push({ word, finders, isExclusive: isEx, score: fScore });

                return { 
                    ranking: Object.entries(scores).map(([uid, s]) => ({ uid, name: roomData.players[uid]?.name||'', team: roomData.players[uid]?.team, score: s })).sort((a,b) => b.score - a.score), 
                    teamScores: { red: tRed, blue: tBlue }, wordDetails: details.sort(()=>Math.random()-0.5), totalWordsFound: details.length

                                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-1">
                                    {ranking.filter(p => p.team === 'red').map((player, idx) => (

                                            <span className={`font-bold text-[10px] sm:text-[11px] truncate mr-1 ${player.uid === user.uid ? 'text-red-900' : 'text-slate-700'}`}>{player.name}</span><span className="font-black text-xs sm:text-sm text-red-600">{player.score}</span>

                                <div className="text-center border-b border-blue-100 pb-1 mb-2 flex-shrink-0"><h3 className="text-xs sm:text-sm font-bold text-blue-600 mb-0.5">블루 팀</h3><p className="text-2xl sm:text-3xl font-black text-slate-800">{teamScores.blue}</p></div>

                                        <div key={idx} className={`flex justify-between items-center p-1.5 rounded-lg border ${player.uid === user.uid ? 'bg-blue-100 border-blue-300 ring-1 ring-blue-400' : 'bg-white border-blue-100'}`}>
                                            <span className={`font-bold text-[10px] sm:text-[11px] truncate mr-1 ${player.uid === user.uid ? 'text-blue-900' : 'text-slate-700'}`}>{player.name}</span><span className="font-black text-xs sm:text-sm text-blue-600">{player.score}</span>

                                    const p = room.players[uid];
                                    if (p && !p.isTeacher) {
                                        if (!scoresByName[p.name]) scoresByName[p.name] = { name: p.name, score: 0 };
                                        scoresByName[p.name].score += fScore;
                                        if (currentRoomPlayers[uid]) currentRoomPlayers[uid].score += fScore;
                                        if (room.mode === 'team') p.team === 'red' ? roomRed += fScore : roomBlue += fScore; 
                                    }
                                });
                            });

                            const repName = getRepName(room);
                            if (room.mode === 'team') {
                                const redPlayers = Object.values(currentRoomPlayers).filter(p => p.team === 'red').sort((a,b)=>b.score-a.score);
                                const bluePlayers = Object.values(currentRoomPlayers).filter(p => p.team === 'blue').sort((a,b)=>b.score-a.score);
                                tBattles.push({ hostName: room.players[room.hostId]?.name||'알수없음', repName: repName, redScore: roomRed, blueScore: roomBlue, redPlayers, bluePlayers, date: room.endTime||Date.now() });
                            } else if (room.mode === 'class') {
                                const sortedPlayers = Object.values(currentRoomPlayers).sort((a,b)=>b.score-a.score);
                                cBattles.push({ hostName: room.players[room.hostId]?.name||'알수없음', repName: repName, players: sortedPlayers, date: room.endTime||Date.now() });
                            }
                        });
                        
                        setAllData({ leaderboard: Object.values(scoresByName).sort((a, b) => b.score - a.score), teamBattles: tBattles.sort((a, b) => b.date - a.date), classBattles: cBattles.sort((a, b) => b.date - a.date) });
                    } catch (err) { console.error(err); } finally { setLoading(false); }
                };
                fetchData();
            }, [db, appId]);

            const { leaderboard, teamBattles, classBattles } = useMemo(() => {
                const isMatch = (name) => {
                    if (!name) return false;
                    const matchG = filterGrade === '' || name.includes(`${filterGrade}학년 `);
                    const matchC = filterClass === '' || name.includes(` ${filterClass}반 `);
                    return matchG && matchC;
                };
                return { leaderboard: allData.leaderboard.filter(p => isMatch(p.name)), teamBattles: allData.teamBattles.filter(b => isMatch(b.repName)), classBattles: allData.classBattles.filter(b => isMatch(b.repName)) };
            }, [allData, filterGrade, filterClass]);

            return (
                <div className="flex flex-col h-full w-full max-w-3xl mx-auto px-2 pb-2">
                    <div className="flex justify-between items-center mb-4 flex-shrink-0"><h2 className="text-xl font-black flex items-center text-slate-800"><Trophy className="w-5 h-5 mr-1 text-amber-500" /> 명예의 전당</h2><button onClick={onBack} className="text-xs bg-white border px-3 py-1.5 rounded-full font-bold shadow-sm hover:bg-slate-50 transition-colors">✕ 닫기</button></div>
                    <div className="flex w-full mb-3 bg-slate-100 p-1 rounded-lg flex-shrink-0"><button onClick={() => setActiveTab('ranking')} className={`flex-1 py-1.5 rounded-md text-[10px] sm:text-xs font-bold transition-all ${activeTab==='ranking'?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>개인 누적 랭킹</button><button onClick={() => setActiveTab('class')} className={`flex-1 py-1.5 rounded-md text-[10px] sm:text-xs font-bold transition-all ${activeTab==='class'?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>학급 개인전</button><button onClick={() => setActiveTab('team')} className={`flex-1 py-1.5 rounded-md text-[10px] sm:text-xs font-bold transition-all ${activeTab==='team'?'bg-white text-indigo-600 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>팀 대결</button></div>
                    <div className="flex space-x-2 mb-3 flex-shrink-0"><select value={filterGrade} onChange={e => setFilterGrade(e.target.value)} className="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"><option value="">모든 학년</option>{[1,2,3,4,5,6].map(g => <option key={g} value={g}>{g}학년</option>)}</select><select value={filterClass} onChange={e => setFilterClass(e.target.value)} className="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"><option value="">모든 반</option>{Array.from({length:15},(_,i)=>i+1).map(c => <option key={c} value={c}>{c}반</option>)}</select></div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar bg-white rounded-2xl border border-slate-200 shadow-sm p-3">
                        {loading ? <div className="text-center text-xs text-slate-400 mt-10 animate-pulse">불러오는 중...</div> : 
                            activeTab === 'ranking' ? (leaderboard.length === 0 ? <div className="text-center text-xs text-slate-400 mt-10">기록이 없습니다.</div> : leaderboard.map((p, idx) => <div key={idx} className={`flex items-center justify-between p-3 border-b border-slate-100 last:border-0 ${idx<3?'bg-amber-50/30 rounded-lg':''}`}><div className="flex items-center"><span className={`w-6 font-black text-center text-sm ${idx<3?'text-amber-500':'text-slate-400'}`}>{idx+1}</span><span className="text-xs font-bold text-slate-700 ml-2">{maskFullName(p.name)}</span></div><div className="font-black text-sm text-slate-800">{p.score} <span className="text-[10px] font-normal text-slate-500">점</span></div></div>))
                            : activeTab === 'class' ? (classBattles.length === 0 ? <div className="text-center text-xs text-slate-400 mt-10">기록이 없습니다.</div> : classBattles.map((b, idx) => <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 shadow-sm"><div className="text-[10px] text-slate-400 mb-2 border-b border-slate-200 pb-1.5 flex justify-between items-center"><span>{new Date(b.date).toLocaleString()}</span><span className="font-bold">방장: {maskFullName(b.hostName)}</span></div><div className="space-y-1 mt-2 max-h-40 overflow-y-auto custom-scrollbar pr-1">{b.players.map((p, i) => <div key={i} className="flex justify-between items-center text-xs bg-white p-2 border border-slate-100 rounded-lg"><div className="flex items-center"><span className={`w-5 text-[10px] font-black ${i<3 ? 'text-amber-500' : 'text-slate-400'}`}>{i+1}</span><span className="text-slate-700 font-bold truncate ml-1">{maskShortName(p.name)}</span></div><span className="font-black text-indigo-600">{p.score} 점</span></div>)}</div></div>))
                            : (teamBattles.length === 0 ? <div className="text-center text-xs text-slate-400 mt-10">기록이 없습니다.</div> : teamBattles.map((b, idx) => <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4 shadow-sm"><div className="text-[10px] text-slate-400 mb-2 border-b border-slate-200 pb-1.5 flex justify-between items-center"><span>{new Date(b.date).toLocaleString()}</span><span className="font-bold">방장: {maskFullName(b.hostName)}</span></div><div className="flex justify-between items-stretch gap-2 mt-2"><div className="flex-1 bg-white border border-red-100 rounded-lg p-2 flex flex-col"><div className="text-center mb-1 border-b border-red-50 pb-1"><div className="text-[10px] font-bold text-red-500 mb-0.5">레드 팀</div><div className="text-base font-black text-slate-800">{b.redScore}</div></div><div className="flex-1 space-y-1 mt-1 max-h-40 overflow-y-auto custom-scrollbar pr-1">{b.redPlayers.map((p, i) => <div key={i} className="flex justify-between items-center text-[10px] bg-red-50/50 p-1.5 border border-red-50 rounded"><span className="text-slate-700 truncate font-medium mr-1">{maskShortName(p.name)}</span><span className="font-bold text-red-600">{p.score}</span></div>)}</div></div><div className="flex flex-col justify-center items-center px-1"><span className="text-[10px] font-black text-slate-300">VS</span></div><div className="flex-1 bg-white border border-blue-100 rounded-lg p-2 flex flex-col"><div className="text-center mb-1 border-b border-blue-50 pb-1"><div className="text-[10px] font-bold text-blue-500 mb-0.5">블루 팀</div><div className="text-base font-black text-slate-800">{b.blueScore}</div></div><div className="flex-1 space-y-1 mt-1 max-h-40 overflow-y-auto custom-scrollbar pr-1">{b.bluePlayers.map((p, i) => <div key={i} className="flex justify-between items-center text-[10px] bg-blue-50/50 p-1.5 border border-blue-50 rounded"><span className="text-slate-700 truncate font-medium mr-1">{maskShortName(p.name)}</span><span className="font-bold text-blue-600">{p.score}</span></div>)}</div></div></div></div>))
                        }
                    </div>
                </div>
            );
        }

        // React 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WordAlchemistApp />);
    </script>
</body>
</html>
