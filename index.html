            --primary: #4F46E5;
            --primary-light: #EEF2FF;

            --secondary-light: #F5F3FF;
            --teacher: #D97706;
            --teacher-light: #FEF3C7;
            --accent: #06B6D4;
            --bg-page: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-sub: #475569;
            --text-muted: #94A3B8;
            --success: #10B981;
            --danger: #EF4444;

            --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.08), 0 4px 10px -2px rgba(0,0,0,0.04);
            --shadow-float: 0 14px 34px -4px rgba(79, 70, 229, 0.22);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 50%, #F5F3FF 100%);
            min-height: 100vh;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .custom-scrollbar::-webkit-scrollbar-track { background: #F1F5F9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        .alch-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0.8rem 1.2rem 2.5rem;
            box-sizing: border-box;
            width: 100%;
        }

        /* 1. 상단 타이틀 헤더 및 시인성 극대화된 서브타이틀 */
        .hdr {
            text-align: center;
            padding: 0.4rem 0 1.2rem;
        }

        .hdr h1 {
            font-size: clamp(1.7rem, 3.4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #312E81 0%, #4F46E5 40%, #9333EA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.45rem;
            line-height: 1.2;
        }

        .hdr-sub-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 2px solid #818CF8;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
            padding: 0.45rem 1.3rem;
            border-radius: 99px;
            margin-top: 0.2rem;
        }

        .hdr-sub-text {
            font-size: clamp(0.95rem, 2vw, 1.08rem) !important;
            color: #1E1B4B !important;
            font-weight: 800 !important;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        /* 홈 화면 좌우 2분할 레이아웃 (게임 모드 50%, 명예의 전당 50%) */
        .home-split-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
            align-items: stretch;
            width: 100%;
        }

        @media (max-width: 960px) {
            .home-split-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
        }

        /* 공통 카드 컴포넌트 */
        .alch-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 1.6rem;
            box-shadow: var(--shadow-lg);
            box-sizing: border-box;
            position: relative;
        }

        .alch-card-title {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* 히어로 스타일 1인 플레이 버튼 */
        .btn-mode-hero {
            width: 100%;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 1.05rem 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 18px var(--primary-glow);
            text-align: left;
        }

        .btn-mode-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.35);
            background: linear-gradient(135deg, #4338CA 0%, #6D28D9 100%);
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .hero-icon {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }

        .hero-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            display: block;
            margin-bottom: 0.2rem;
        }

        .hero-desc {
            font-size: 0.83rem;
            opacity: 0.92;
            font-weight: 500;
            display: block;
        }

        .hero-arrow {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .btn-mode-hero:hover .hero-arrow {
            transform: translateX(3px);
            background: rgba(255, 255, 255, 0.35);
        }

        /* 보조 멀티플레이 모드 버튼 */
        .sub-mode-btn {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem 1.05rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .sub-mode-btn:hover {
            border-color: var(--primary);
            background: #F8FAFC;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .sm-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .sm-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .sub-mode-btn.p1v1 .sm-icon { background: #FEF3C7; color: #D97706; }
        .sub-mode-btn.team .sm-icon { background: #DBEAFE; color: #2563EB; }
        .sub-mode-btn.class .sm-icon { background: #EDE9FE; color: #7C3AED; }

        .sm-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.15rem;
        }

        .sm-desc {
            font-size: 0.77rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 교사 링크 버튼 */
        .btn-teacher-link {
            width: 100%;
            background: #FFFBEB;
            border: 1px dashed #F59E0B;
            border-radius: 12px;
            padding: 0.65rem;
            color: #B45309;
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-top: 0.85rem;
        }

        .btn-teacher-link:hover {
            background: #FEF3C7;
            border-color: #D97706;
            color: #92400E;
        }

        /* 학생 환영 뱃지 바 */
        .student-welcome-bar {
            background: #FFFFFF;
            border: 1px solid #E0E7FF;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.05);
        }

        /* BGM 위젯 플로팅 */
        .bgm-widget {
            position: fixed;
            top: 68px;
            right: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 99px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .bgm-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 6px;
        }

        .bgm-slider {
            width: 65px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 마법 알파벳 타일 입체 효과 */
        .magic-tile {
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
            border: 1.5px solid #CBD5E1;
            box-shadow: 0 4px 0 #94A3B8, 0 6px 12px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease-out;
            user-select: none;
        }

        .magic-tile:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #818CF8;
            box-shadow: 0 6px 0 #6366F1, 0 8px 16px rgba(99, 102, 241, 0.2);
        }

        .magic-tile:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #6366F1;
        }

        .magic-tile:disabled {
            background: #E2E8F0;
            border-color: #CBD5E1;
            color: #94A3B8;
            box-shadow: none;
            transform: scale(0.96);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 조합대 마법 구슬 */
        .orb-chip {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            font-weight: 900;
            border-radius: 10px;
            box-shadow: 0 3px 0 #312E81, 0 4px 10px rgba(79, 70, 229, 0.3);
            transition: all 0.15s;
            cursor: pointer;
        }

        .orb-chip:hover {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            box-shadow: 0 3px 0 #991B1B;
            transform: translateY(-2px);
        }

        /* LIVE 펄스 점 */
        .live-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 1.8s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

,USE,USED,USEFUL,USELESS,USER,USUAL,UTILITY,VACCINE,VALIANT,VALID,VALLEY,VALUABLE,VALUE,VAN,VARIABLE,VARIED,VARIETY,VARIOUS,VARY,VAST,VAT,VEGETABLE,VENDOR,VENTURE,VERBAL,VERDICT,VERSION,VERTICAL,VERY,VET,VETERAN,VIA,VICE,VICTIM,VICTOR,VICTORY,VIDEO,VIE,VIEW,VIEWED,VILLAGE,VIOLATE,VIOLENT,VIOLIN,VIRTUAL,VIRTUE,VIRUS,VISIBLE,VISION,VISIT,VISITOR,VISUAL,VITAL,VOICE,VOICES,VOLTAGE,VOLUME,VOLUNTEER,VOTE,VOUCHER,VOW,VOYAGE,WAGE,WAIT,WAKE,WALK,WALKER,WALKING,WALL,WANT,WANTED,WAR,WARM,WARRANT,WARREN,WARRIOR,WASH,WASTE,WASTED,WATCH,WATCHER,WATER,WATERS,WAVE,WAX,WAY,WAYS,WE,WEAK,WEAKLY,WEALTH,WEAPON,WEAR,WEATHER,WEB,WEBCAST,WEBSITE,WED,WEE,WEEK,WEEKEND,WEEKLY,WEIGHT,WELCOME,WELFARE,WELL,WENT,WERE,WEST,WESTERN,WET,WETLAND,WHAT,WHEEL,WHEN,WHERE,WHEREAS,WHETHER,WHICH,WHILE,WHISPER,WHISTLE,WHITE,WHO,WHOLE,WHOM,WHOSE,WHY,WIDE,WIFE,WIG,WILD,WILL,WIN,WIND,WINDOW,WINE,WING,WINNER,WINNING,WINTER,WIPE,WIRE,WIRELESS,WISDOM,WISE,WISH,WIT,WITH,WITHOUT,WITNESS,WOE,WOK,WOMAN,WOMEN,WON,WONDER,WOO,WOOD,WOODEN,WORD,WORE,WORK,WORKER,WORKING,WORKOUT,WORLD,WORRY,WORSE,WORSHIP,WORST,WORTH,WORTHY,WOULD,WOUND,WOW,WRITE,WRITER,WRITING,WRITTEN,WRONG,WROTE,YAK,YAM,YAP,YARD,YARDAGE,YAW,YEA,YEAH,YEAR,YEARBOOK,YEARLY,YELLOW,YES,YET,YEW,YIELD,YIELDED,YIP,YON,YOU,YOUNG,YOUR,YOUTH,YOUTHFUL,YUM,ZEALOUS,ZEN,ZERO,ZIP,ZONE,ZOO";
        const COMMON_WORDS_DB = new Set(commonWordsString.split(','));

        // ════════════════════════════════════════════════════════════════════
        // ── 메인 앱 컴포넌트: WordAlchemistApp ──
        // ════════════════════════════════════════════════════════════════════
        function WordAlchemistApp() {
            const [user, setUser] = useState(null);
            const [roomId, setRoomId] = useState('');
            const [roomData, setRoomData] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [isJoining, setIsJoining] = useState(false);
            const [isTeacherScreen, setIsTeacherScreen] = useState(false);
            const [showPwdModal, setShowPwdModal] = useState(false);
            const [bgmPlaying, setBgmPlaying] = useState(false);
            const [bgmVolume, setBgmVolume] = useState(0.2);

            // GNB 및 로컬 스토리지 연동 학생 프로필
            const [userInfo, setUserInfo] = useState(() => {
                try {
                    const p = JSON.parse(localStorage.getItem('waurimal_student_profile') || '{}');
                    return {
                        school: p.school || '이의초등학교',
                        grade: p.grade || '6',
                        classNum: p.classNum || '1',
                        studentNum: p.studentNum || '1',
                        name: p.name || ''
                    };
                } catch (e) {
                    return { school: '이의초등학교', grade: '6', classNum: '1', studentNum: '1', name: '' };
                }
            });

            // GNB 프로필 업데이트 이벤트 수신
            useEffect(() => {
                const handleProfileUpdate = (e) => {
                    const p = e.detail;
                    if (p) {
                        setUserInfo({
                            school: p.school || '이의초등학교',
                            grade: p.grade || '6',
                            classNum: p.classNum || '1',
                            studentNum: p.studentNum || '1',
                            name: p.name || ''
                        });
                    }
                };
                window.addEventListener('waurimal_student_updated', handleProfileUpdate);
                return () => window.removeEventListener('waurimal_student_updated', handleProfileUpdate);
            }, []);

            // Firebase 익명 로그인
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setErrorMsg("Firebase 인증에 실패했습니다.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 공용 사전 로딩
            useEffect(() => {
                if (!user) return;
                const loadGlobalDictionary = async () => {
                    try {
                        const dictRef = doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'global_dictionary');
                        const snap = await getDoc(dictRef);
                        if (snap.exists() && snap.data().words) {
                            snap.data().words.forEach(w => COMMON_WORDS_DB.add(w));
                        }
                    } catch (e) {
                        console.warn("공용 사전 로드 오류:", e);
                    }
                };
                loadGlobalDictionary();
            }, [user]);

            // 실시간 룸 동기화
            useEffect(() => {
                if (!user || !roomId || isJoining) return;

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomId);
                const unsubscribe = onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setRoomData(docSnap.data());
                    } else {
                        setErrorMsg("방이 존재하지 않거나 종료되었습니다.");
                        setRoomId('');
                        setRoomData(null);
                    }
                }, (error) => {
                    console.error("Room Sync Error:", error);
                    setErrorMsg("방 정보를 동기화하지 못했습니다.");
                });

                return () => unsubscribe();
            }, [user, roomId, isJoining]);

            // BGM 제어
            const toggleBGM = () => {
                const audio = document.getElementById('alchBgmAudio');
                if (!audio) return;
                if (bgmPlaying) {
                    audio.pause();
                    setBgmPlaying(false);
                } else {
                    audio.volume = bgmVolume;
                    audio.play().then(() => setBgmPlaying(true)).catch(() => {});
                }
            };

            const changeBgmVolume = (val) => {
                const v = parseFloat(val);
                setBgmVolume(v);
                const audio = document.getElementById('alchBgmAudio');
                if (audio) {
                    audio.volume = v;
                    if (v > 0 && audio.paused && bgmPlaying) audio.play();
                }
            };

            // 방 생성 핸들러
            const handleCreateRoom = async (mode, timeLimit = 90, isTeacher = false) => {
                if (!user) return;
                const effectiveName = userInfo.name ? userInfo.name.trim() : '무명연금술사';
                const displayName = isTeacher
                    ? "👨‍🏫 선생님"
                    : `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${effectiveName}`;

                if (containsProfanity(displayName)) {
                    setErrorMsg("부적절한 이름이 포함되어 방을 생성할 수 없습니다.");
                    return;
                }

                const newRoomId = mode === 'single' ? `S_${user.uid.slice(0, 6)}_${Date.now().toString().slice(-4)}` : generateRoomCode();
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, newRoomId);

                try {
                    const initialData = {
                        roomId: newRoomId,
                        hostId: user.uid,
                        status: mode === 'single' ? 'playing' : 'waiting',
                        mode: mode,
                        timeLimit: timeLimit,
                        letters: generateLetters(),
                        endTime: mode === 'single' ? Date.now() + timeLimit * 1000 : null,
                        players: {
                            [user.uid]: { name: displayName, team: 'red', isTeacher: isTeacher }
                        },
                        words: {},
                        meanings: {}
                    };
                    await setDoc(roomRef, initialData);
                    setRoomId(newRoomId);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 생성에 실패했습니다. 다시 시도해 주세요.");
                    console.error(err);
                }
            };

            // 방 참가 핸들러
            const handleJoinRoom = async (codeToJoin) => {
                const code = (codeToJoin || '').trim();
                if (!code || code.length !== 4) {
                    setErrorMsg("올바른 4자리 초대 코드를 입력해 주세요.");
                    return;
                }
                if (!user) return;

                setIsJoining(true);
                const effectiveName = userInfo.name ? userInfo.name.trim() : '도전자';
                const displayName = `${userInfo.grade}학년 ${userInfo.classNum}반 ${userInfo.studentNum}번 ${effectiveName}`;

                if (containsProfanity(displayName)) {
                    setErrorMsg("부적절한 이름이 포함되어 입장할 수 없습니다.");
                    setIsJoining(false);
                    return;
                }

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, code);
                try {
                    const docSnap = await getDoc(roomRef);
                    if (!docSnap.exists()) {
                        setErrorMsg("존재하지 않는 방 코드입니다.");
                        setIsJoining(false);
                        return;
                    }
                    const data = docSnap.data();

                    if (data.status !== 'waiting') {
                        setErrorMsg("이미 게임이 시작되었거나 종료된 방입니다.");
                        setIsJoining(false);
                        return;
                    }
                    if (data.mode === '1v1' && Object.keys(data.players || {}).length >= 2) {
                        setErrorMsg("1:1 진검승부 방 인원이 이미 가득 찼습니다.");
                        setIsJoining(false);
                        return;
                    }

                    let assignedTeam = 'blue';
                    if (data.mode === 'team') {
                        const redCount = Object.values(data.players || {}).filter(p => p.team === 'red').length;
                        const blueCount = Object.values(data.players || {}).filter(p => p.team === 'blue').length;
                        assignedTeam = redCount > blueCount ? 'blue' : 'red';
                    }

                    await updateDoc(roomRef, {
                        [`players.${user.uid}`]: { name: displayName, team: assignedTeam, isTeacher: false }
                    });

                    setRoomId(code);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg("방 참가 중 오류가 발생했습니다.");
                    console.error(err);
                } finally {
                    setIsJoining(false);
                }
            };

            const handleExitRoom = () => {
                setRoomId('');
                setRoomData(null);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-indigo-700">
                        <i className="fas fa-hat-wizard text-4xl mb-3 text-indigo-600 animate-bounce"></i>
                        <h2 className="text-xl font-bold">마법의 기운을 불러오는 중...</h2>
                        <p className="text-xs text-slate-400 mt-1">Firebase 클라우드 연동 대기</p>
                    </div>
                );
            }

            return (
                <div className="alch-wrap">
                    {/* BGM 플로팅 컨트롤러 */}
                    <div className="bgm-widget">
                        <button type="button" className="bgm-toggle-btn" onClick={toggleBGM}>
                            <i className={`fas ${bgmPlaying ? 'fa-volume-up text-indigo-600' : 'fa-volume-mute text-slate-400'}`}></i>
                            <span>BGM</span>
                        </button>
                        <input
                            type="range"
                            className="bgm-slider"
                            min="0"
                            max="1"
                            step="0.05"
                            value={bgmVolume}
                            onChange={(e) => changeBgmVolume(e.target.value)}
                            title="BGM 볼륨 조절"
                        />
                    </div>

                    {/* 상단 통합 헤더 */}
                    <header className="hdr">
                        <h1>WORD ALCHEMIST</h1>
                        <div className="hdr-sub-box">
                            <span className="hdr-sub-text">
                                <i className="fas fa-wand-magic-sparkles" style={{ color: '#4F46E5' }}></i>
                                알파벳을 조합하여 새로운 영단어를 연성하는 실시간 마법 대결 놀이터
                            </span>
                        </div>
                    </header>

                    {/* 에러 메시지 알림 바 */}
                    {errorMsg && (
                        <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center justify-between text-red-600 shadow-sm text-sm font-bold">
                            <div className="flex items-center gap-2">
                                <i className="fas fa-exclamation-triangle"></i>
                                <span>{errorMsg}</span>
                            </div>
                            <button onClick={() => setErrorMsg('')} className="text-red-400 hover:text-red-700 font-bold px-2">✕</button>
                        </div>
                    )}

                    {/* 화면 분기 */}
                    {isTeacherScreen ? (
                        <TeacherManagementView
                            db={db}
                            appId={appId}
                            onClose={() => setIsTeacherScreen(false)}
                            onCreateRoom={handleCreateRoom}
                        />
                    ) : !roomData ? (
                        <HomeSplitLobby
                            userInfo={userInfo}
                            setUserInfo={setUserInfo}
                            onCreateRoom={handleCreateRoom}
                            onJoinRoom={handleJoinRoom}
                            onOpenTeacherModal={() => setShowPwdModal(true)}
                            db={db}
                            appId={appId}
                        />
                    ) : roomData.status === 'waiting' ? (
                        <WaitingRoomView
                            roomData={roomData}
                            user={user}
                            appId={appId}
                            onExit={handleExitRoom}
                        />
                    ) : (
                        <GameManager
                            roomData={roomData}
                            user={user}
                            appId={appId}
                            onExit={handleExitRoom}
                        />
                    )}

                    {/* 교사 비밀번호 인증 모달 */}
                    {showPwdModal && (
                        <TeacherPasswordModal
                            db={db}
                            appId={appId}
                            onSuccess={() => {
                                setShowPwdModal(false);
                                setIsTeacherScreen(true);

        // ════════════════════════════════════════════════════════════════════
        // ── 2. 실시간 명예의 전당 카드 (HallOfFameSideCard) ──
        // ════════════════════════════════════════════════════════════════════
        function HallOfFameSideCard({ db, appId }) {
            const [activeTab, setActiveTab] = useState('ranking');
            const [activePeriod, setActivePeriod] = useState('all'); // 'all' | 'month' | 'week'
            const [filterGrade, setFilterGrade] = useState('ALL');
            const [filterClass, setFilterClass] = useState('ALL');
            const [loading, setLoading] = useState(true);
            const [allRooms, setAllRooms] = useState([]);

            const maskName = (nameStr) => {
                if (!nameStr) return '학생';
                const str = String(nameStr).trim();
                if (str.includes('선생님') || str.includes('관리자')) return str;

                const parts = str.split(/\s+/);
                if (parts.length > 1) {
                    const rawName = parts[parts.length - 1];
                    if (!rawName.endsWith('반') && !rawName.endsWith('번') && !rawName.endsWith('학년')) {
                        const prefix = parts.slice(0, -1).join(' ');
                        return prefix + ' ' + maskSingleKoreanName(rawName);
                    }
                }
                return maskSingleKoreanName(str);
            };

            const maskSingleKoreanName = (name) => {
                if (!name) return '';
                const s = name.trim();
                if (s.length <= 1) return s;
                if (s.length === 2) return s[0] + 'O';
                if (s.length === 3) return s[0] + 'O' + s[2];
                return s[0] + 'O'.repeat(s.length - 2) + s[s.length - 1];
            };

            const fetchRecords = async () => {
                setLoading(true);
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    const rooms = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === 'finished');
                    setAllRooms(rooms);
                } catch (e) {
                    console.error("명예의 전당 로드 실패:", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchRecords();
            }, [db, appId]);

            const { personalScores, classBattles, teamBattles } = useMemo(() => {
                const pScores = {};
                const cBattles = [];
                const tBattles = [];

                allRooms.forEach(room => {
                    let roomRed = 0, roomBlue = 0;
                    const curPlayers = {};

                    Object.entries(room.players || {}).forEach(([uid, p]) => {
                        if (!p.isTeacher) {
                            curPlayers[uid] = { name: p.name, team: p.team, score: 0 };
                            if (!pScores[p.name]) pScores[p.name] = { name: p.name, score: 0, date: room.endTime || 0 };
                        }
                    });

                    Object.entries(room.words || {}).forEach(([word, finders]) => {
                        if (!finders || finders.length === 0) return;
                        const bScore = getLengthBonus(word.length) + word.split('').reduce((a, c) => a + (LETTER_SCORES[c] || 0), 0);
                        const isEx = room.mode !== 'single' && finders.length === 1;
                        const fScore = isEx ? (bScore * 2 + 5) : bScore;

                        finders.forEach(uid => {
                            const p = room.players?.[uid];
                            if (p && !p.isTeacher) {
                                if (pScores[p.name]) {
                                    pScores[p.name].score += fScore;
                                    if ((room.endTime || 0) > pScores[p.name].date) pScores[p.name].date = room.endTime || 0;
                                }
                                if (curPlayers[uid]) curPlayers[uid].score += fScore;
                                if (room.mode === 'team') {
                                    p.team === 'red' ? roomRed += fScore : roomBlue += fScore;
                                }
                            }
                        });
                    });

                    const hostP = room.players?.[room.hostId];
                    const hostName = (hostP && !hostP.isTeacher) ? hostP.name : (Object.values(room.players || {}).find(p => !p.isTeacher)?.name || '알수없음');

                    if (room.mode === 'class') {
                        cBattles.push({
                            id: room.id,
                            hostName: hostName,
                            date: room.endTime || Date.now(),
                            players: Object.values(curPlayers).sort((a, b) => b.score - a.score)
                        });
                    } else if (room.mode === 'team') {
                        tBattles.push({
                            id: room.id,
                            hostName: hostName,
                            date: room.endTime || Date.now(),
                            redScore: roomRed,
                            blueScore: roomBlue,
                            redPlayers: Object.values(curPlayers).filter(p => p.team === 'red').sort((a, b) => b.score - a.score),
                            bluePlayers: Object.values(curPlayers).filter(p => p.team === 'blue').sort((a, b) => b.score - a.score)
                        });
                    }
                });

                return {
                    personalScores: Object.values(pScores).sort((a, b) => b.score - a.score),
                    classBattles: cBattles.sort((a, b) => b.date - a.date),
                    teamBattles: tBattles.sort((a, b) => b.date - a.date)
                };
            }, [allRooms]);

            const isMatchFilter = (name) => {
                if (!name) return false;
                const matchG = filterGrade === 'ALL' || name.includes(`${filterGrade}학년 `);
                const matchC = filterClass === 'ALL' || name.includes(` ${filterClass}반 `);
                return matchG && matchC;
            };

            const isMatchPeriod = (dateVal) => {
                if (activePeriod === 'all') return true;
                if (!dateVal) return false;
                const now = new Date();
                const curYear = now.getFullYear();
                const curMonth = now.getMonth();
                const oneWeekAgoMs = now.getTime() - 7 * 24 * 60 * 60 * 1000;
                const t = typeof dateVal.toDate === 'function' ? dateVal.toDate() : new Date(dateVal);
                if (activePeriod === 'month') {
                    return t.getFullYear() === curYear && t.getMonth() === curMonth;
                } else if (activePeriod === 'week') {
                    return t.getTime() >= oneWeekAgoMs;
                }
                return true;
            };

            const filteredPersonal = useMemo(() => personalScores.filter(p => isMatchFilter(p.name) && isMatchPeriod(p.date)), [personalScores, filterGrade, filterClass, activePeriod]);
            const filteredClass = useMemo(() => classBattles.filter(b => isMatchFilter(b.hostName) && isMatchPeriod(b.date)), [classBattles, filterGrade, filterClass, activePeriod]);
            const filteredTeam = useMemo(() => teamBattles.filter(b => isMatchFilter(b.hostName) && isMatchPeriod(b.date)), [teamBattles, filterGrade, filterClass, activePeriod]);

            return (
                <div className="alch-card flex flex-col h-full">
                    {/* 카드 타이틀 & LIVE 배지 */}
                    <div className="flex justify-between items-center mb-3">
                        <div className="alch-card-title mb-0">
                            <i className="fas fa-trophy text-amber-500"></i> 실시간 명예의 전당
                        </div>
                        <div className="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-extrabold border border-emerald-200">
                            <span className="live-dot"></span> LIVE
                        </div>
                    </div>

                    {/* 탭 버튼 */}
                    <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl mb-3">
                        <button
                            type="button"
                            onClick={() => setActiveTab('ranking')}
                            className={`py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'ranking' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            개인 누적
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveTab('class')}
                            className={`py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'class' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            학급 개인전
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveTab('team')}
                            className={`py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'team' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            팀 대결
                        </button>
                    </div>

                    {/* 1. 기간 선택 탭 (단어타자연습 표준 동일) */}
                    <div className="flex bg-slate-100 p-1 rounded-xl gap-1 mb-2.5">
                        <button
                            type="button"
                            onClick={() => setActivePeriod('all')}
                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${activePeriod === 'all' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            전체 기간
                        </button>
                        <button
                            type="button"
                            onClick={() => setActivePeriod('month')}
                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${activePeriod === 'month' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            이번 달
                        </button>
                        <button
                            type="button"
                            onClick={() => setActivePeriod('week')}
                            className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${activePeriod === 'week' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            이번 주
                        </button>
                    </div>

                    {/* 2. 학년(3~6학년) & 반(1~15반) 필터 */}
                    <div className="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <select
                                value={filterGrade}
                                onChange={(e) => setFilterGrade(e.target.value)}
                                className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="ALL">전체 학년</option>
                                <option value="3">3학년</option>
                                <option value="4">4학년</option>
                                <option value="5">5학년</option>
                                <option value="6">6학년</option>
                            </select>
                        </div>
                        <div>
                            <select
                                value={filterClass}
                                onChange={(e) => setFilterClass(e.target.value)}
                                className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500"
                            >
                                <option value="ALL">전체 반</option>
                                {Array.from({ length: 15 }, (_, i) => i + 1).map(c => (
                                    <option key={c} value={c}>{c}반</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* 랭킹 목록 영역 */}
                    <div className="flex-1 overflow-y-auto custom-scrollbar border border-slate-100 rounded-xl p-2 bg-slate-50/60 min-h-[320px] max-h-[480px]">
                        {loading ? (
                            <div className="text-center py-16 text-slate-400 text-xs font-bold animate-pulse">
                                <i className="fas fa-spinner fa-spin text-lg mb-2"></i><br />
                                명예의 전당 기록을 집계 중입니다...
                            </div>
                        ) : activeTab === 'ranking' ? (
                            filteredPersonal.length === 0 ? (
                                <div className="text-center py-16 text-slate-400 text-xs font-bold">
                                    <span className="text-2xl block mb-1">🎯</span>
                                    선택한 조건의 도전 기록이 없습니다.<br />
                                    지금 1인 연습에 도전해 1위가 되어보세요!
                                </div>
                            ) : (
                                filteredPersonal.map((p, idx) => {
                                    const rank = idx + 1;
                                    const rankBadge = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                                    const bgStyle = rank === 1 ? 'bg-amber-50/80 border-amber-200' : rank === 2 ? 'bg-slate-100/90 border-slate-200' : rank === 3 ? 'bg-orange-50/80 border-orange-200' : 'bg-white border-slate-100';

                                    return (
                                        <div key={idx} className={`flex items-center justify-between p-2.5 mb-1.5 rounded-xl border shadow-sm ${bgStyle} transition-transform hover:-translate-y-0.5`}>
                                            <div className="flex items-center gap-2.5 overflow-hidden">
                                                <span className={`w-6 text-center font-black text-sm ${rank <= 3 ? 'text-amber-600' : 'text-slate-400'}`}>
                                                    {rankBadge}
                                                </span>
                                                <div className="truncate">
                                                    <span className="font-extrabold text-xs text-slate-800 block truncate">{maskName(p.name)}</span>
                                                </div>
                                            </div>
                                            <div className="text-right flex-shrink-0">
                                                <span className="font-black text-sm text-indigo-600">{p.score.toLocaleString()}</span>
                                                <span className="text-[10px] text-slate-400 ml-0.5 font-bold">점</span>
                                            </div>
                                        </div>
                                    );
                                })
                            )
                        ) : activeTab === 'class' ? (
                            filteredClass.length === 0 ? (
                                <div className="text-center py-16 text-slate-400 text-xs font-bold">기록된 학급 대결이 없습니다.</div>
                            ) : (
                                filteredClass.map((b, idx) => (
                                    <div key={idx} className="bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm">
                                        <div className="text-[11px] text-slate-400 mb-2 pb-1.5 border-b border-slate-100 flex justify-between">
                                            <span>📅 {new Date(b.date).toLocaleDateString()}</span>
                                            <span className="font-bold text-slate-600">방장: {maskName(b.hostName)}</span>
                                        </div>
                                        <div className="space-y-1 max-h-32 overflow-y-auto custom-scrollbar pr-1">
                                            {b.players.slice(0, 5).map((p, i) => (
                                                <div key={i} className="flex justify-between items-center text-xs p-1.5 bg-slate-50 rounded">
                                                    <span className="font-bold text-slate-700">{i + 1}위 {maskName(p.name)}</span>
                                                    <span className="font-black text-indigo-600">{p.score}점</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))
                            )
                        ) : (
                            filteredTeam.length === 0 ? (
                                <div className="text-center py-16 text-slate-400 text-xs font-bold">기록된 팀 대결이 없습니다.</div>
                            ) : (
                                filteredTeam.map((b, idx) => (
                                    <div key={idx} className="bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm">
                                        <div className="text-[11px] text-slate-400 mb-2 pb-1.5 border-b border-slate-100 flex justify-between">
                                            <span>📅 {new Date(b.date).toLocaleDateString()}</span>
                                            <span className="font-bold text-slate-600">방장: {maskName(b.hostName)}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-center text-xs font-bold">
                                            <div className="p-2 bg-red-50 text-red-700 rounded-lg border border-red-100">
                                                <div>레드 팀</div>
                                                <div className="text-base font-black">{b.redScore}점</div>
                                            </div>
                                            <div className="p-2 bg-blue-50 text-blue-700 rounded-lg border border-blue-100">
                                                <div>블루 팀</div>
                                                <div className="text-base font-black">{b.blueScore}점</div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )
                        )}
                    </div>

                    {/* 하단 새로고침 바 */}
                    <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100 text-xs text-slate-400 font-semibold">
                        <span>실시간 누적 기록 반영</span>
                        <button
                            type="button"
                            onClick={fetchRecords}
                            className="flex items-center gap-1 px-2.5 py-1 text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 rounded-lg transition-colors font-bold"
                        >
                            <i className="fas fa-sync-alt"></i> 새로고침
                        </button>
                    </div>
                </div>
            );
        }

        // ════════════════════════════════════════════════════════════════════
        // ── 3. 교사 비밀번호 인증 모달 (TeacherPasswordModal) ──
        // ════════════════════════════════════════════════════════════════════
        function TeacherPasswordModal({ db, appId, onSuccess, onClose }) {
            const [pwd, setPwd] = useState('');
            const [storedPwd, setStoredPwd] = useState('1234');

            useEffect(() => {
                const fetchPwd = async () => {
                    try {
                        const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'teacher_config'));
                        if (snap.exists() && snap.data().password) {
                            setStoredPwd(snap.data().password);
                        }
                    } catch (e) {}
                };
                fetchPwd();
            }, [db, appId]);

            const handleCheck = () => {
                const trimmed = pwd.trim();
                const waurimalPw = localStorage.getItem('waurimal_admin_pw');
                if (trimmed === storedPwd || trimmed === '0000' || trimmed === '1234' || (waurimalPw && trimmed === waurimalPw)) {
                    onSuccess();
                } else {
                    alert("비밀번호가 일치하지 않습니다. (기본: 0000 또는 1234)");
                    setPwd('');
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in">
                    <div className="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl border border-slate-100">
                        <div className="text-3xl mb-2">🔒</div>
                        <h3 className="text-lg font-black text-slate-800 mb-1">교사 모드 접속</h3>
                        <p className="text-xs text-slate-500 mb-4">관리자 비밀번호를 입력해 주세요.</p>
                        <input
                            type="password"
                            autoFocus
                            value={pwd}
                            onChange={(e) => setPwd(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && handleCheck()}
                            placeholder="****"
                            className="w-full p-2.5 text-center text-xl font-bold tracking-widest bg-slate-50 border rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none"
                        />
                        <div className="flex gap-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="flex-1 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl"
                            >
                                취소
                            </button>
                            <button
                                type="button"
                                onClick={handleCheck}
                                className="flex-1 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md"
                            >
                                확인
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ════════════════════════════════════════════════════════════════════
        // ── 4. 교사 전용 관리 페이지 (TeacherManagementView) ──
        // ════════════════════════════════════════════════════════════════════
        function TeacherManagementView({ db, appId, onClose, onCreateRoom }) {
            const [activeTab, setActiveTab] = useState('settings');
            const [timeLimit, setTimeLimit] = useState(90);
            const [battleMode, setBattleMode] = useState('class');
            const [newPwd, setNewPwd] = useState('');
            const [records, setRecords] = useState([]);
            const [loadingRecords, setLoadingRecords] = useState(false);
            const [filterG, setFilterG] = useState('ALL');
            const [filterC, setFilterC] = useState('ALL');
            const [searchName, setSearchName] = useState('');
            const [delG, setDelG] = useState('');
            const [delC, setDelC] = useState('');

            const loadRecords = async () => {
                setLoadingRecords(true);
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    const pMap = {};

                    snap.forEach((docSnap) => {
                        const room = docSnap.data();
                        if (room.status !== 'finished') return;

                        Object.entries(room.players || {}).forEach(([uid, p]) => {
                            if (!p.isTeacher && !pMap[p.name]) {
                                pMap[p.name] = { name: p.name, score: 0, date: room.endTime || 0, wordCount: 0 };
                            }
                        });

                        Object.entries(room.words || {}).forEach(([word, finders]) => {
                            if (!finders || finders.length === 0) return;
                            const bScore = getLengthBonus(word.length) + word.split('').reduce((a, c) => a + (LETTER_SCORES[c] || 0), 0);
                            const isEx = room.mode !== 'single' && finders.length === 1;
                            const fScore = isEx ? (bScore * 2 + 5) : bScore;

                            finders.forEach(uid => {
                                const p = room.players?.[uid];
                                if (p && !p.isTeacher && pMap[p.name]) {
                                    pMap[p.name].score += fScore;
                                    pMap[p.name].wordCount += 1;
                                    if ((room.endTime || 0) > pMap[p.name].date) pMap[p.name].date = room.endTime || 0;
                                }
                            });
                        });
                    });

                    setRecords(Object.values(pMap).sort((a, b) => b.score - a.score));
                } catch (e) {
                    console.error("기록 로드 실패:", e);
                } finally {
                    setLoadingRecords(false);
                }
            };

            useEffect(() => {
                if (activeTab === 'records') loadRecords();
            }, [activeTab]);

            const handleChangePwd = async () => {
                if (!newPwd.trim()) return alert("새 비밀번호를 입력해 주세요.");
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', SETTINGS_COLLECTION, 'teacher_config'), { password: newPwd.trim() }, { merge: true });
                    localStorage.setItem('waurimal_admin_pw', newPwd.trim());
                    alert("교사 비밀번호가 성공적으로 변경되었습니다.");
                    setNewPwd('');
                } catch (e) {
                    alert("비밀번호 변경 실패: " + e.message);
                }
            };

            const handleDeleteClassRooms = async () => {
                if (!delG || !delC) return alert("학년과 반을 모두 선택해 주세요.");
                if (!confirm(`${delG}학년 ${delC}반 학생이 포함된 모든 대결 방 기록을 삭제하시겠습니까? (복구 불가)`)) return;

                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    let count = 0;
                    const targetKeyword = `${delG}학년 ${delC}반`;

                    for (const docSnap of snap.docs) {
                        const data = docSnap.data();
                        const hostP = data.players?.[data.hostId];
                        const hasClassPlayer = Object.values(data.players || {}).some(p => p.name && p.name.includes(targetKeyword));

                        if ((hostP && hostP.name && hostP.name.includes(targetKeyword)) || hasClassPlayer) {
                            await deleteDoc(docSnap.ref);
                            count++;
                        }
                    }

                    alert(`총 ${count}개의 학급 기록이 성공적으로 삭제되었습니다.`);
                    setDelG('');
                    setDelC('');
                    if (activeTab === 'records') loadRecords();
                } catch (e) {
                    alert("삭제 중 오류가 발생했습니다: " + e.message);
                }
            };

            const handleDeleteSingleStudent = async (studentName) => {
                if (!confirm(`'${studentName}' 학생의 모든 누적 연성 기록을 삭제하시겠습니까?`)) return;

                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION));
                    for (const docSnap of snap.docs) {
                        const data = docSnap.data();
                        let modified = false;
                        const newPlayers = { ...data.players };
                        const newWords = { ...data.words };
                        const removedUids = [];

                        Object.entries(newPlayers).forEach(([uid, p]) => {
                            if (p.name === studentName) {
                                removedUids.push(uid);
                                delete newPlayers[uid];
                                modified = true;
                            }
                        });

                        if (modified) {
                            Object.entries(newWords).forEach(([w, finders]) => {
                                newWords[w] = finders.filter(id => !removedUids.includes(id));
                            });
                            await updateDoc(docSnap.ref, { players: newPlayers, words: newWords });
                        }
                    }

                    alert(`${studentName} 학생의 기록이 성공적으로 삭제되었습니다.`);
                    loadRecords();
                } catch (e) {
                    alert("삭제 실패: " + e.message);
                }
            };

            const downloadCSV = () => {
                if (!filteredRecords.length) return alert("다운로드할 데이터가 없습니다.");
                let csv = "\uFEFF순위,학적,학생명,누적점수,연성단어수,최근참여일시\n";
                filteredRecords.forEach((r, i) => {
                    const dateStr = r.date ? new Date(r.date).toLocaleString() : '-';
                    csv += `"${i + 1}","${r.name}","${r.name.split(' ').pop() || ''}","${r.score}","${r.wordCount}","${dateStr}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `단어연금술사_학생성적_${new Date().toISOString().slice(0, 10)}.csv`;
                link.click();
            };

            const filteredRecords = useMemo(() => {
                return records.filter(p => {
                    const matchG = filterG === 'ALL' || p.name.includes(`${filterG}학년 `);
                    const matchC = filterC === 'ALL' || p.name.includes(` ${filterC}반 `);
                    const matchName = !searchName.trim() || p.name.includes(searchName.trim());
                    return matchG && matchC && matchName;
                });
            }, [records, filterG, filterC, searchName]);

            return (
                <div className="alch-card max-w-4xl mx-auto w-full animate-in zoom-in-95">
                    {/* 상단 타이틀 바 & 돌아가기 버튼 */}
                    <div className="flex justify-between items-center mb-5 pb-4 border-b border-slate-100 flex-wrap gap-2">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl">🔧</span>
                            <div>
                                <h2 className="text-xl font-black text-amber-700">교사 설정 및 학생 결과 관리</h2>
                                <p className="text-xs text-slate-500">게임 규칙 제어, 학생 성적 관리 및 학급 데이터 관리를 지원합니다.</p>
                            </div>
                        </div>
                        <button
                            type="button"
                            onClick={onClose}
                            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"
                        >
                            <i className="fas fa-arrow-left"></i> 홈으로 돌아가기
                        </button>
                    </div>

                    {/* 탭 네비게이션 */}
                    <div className="grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-xl mb-5 text-xs font-bold">
                        <button
                            type="button"
                            onClick={() => setActiveTab('settings')}
                            className={`py-2 rounded-lg transition-all ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            🎮 게임 룰 & 교사용 방 생성
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveTab('records')}
                            className={`py-2 rounded-lg transition-all ${activeTab === 'records' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            📊 학생 연성 성적표
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveTab('deleteClass')}
                            className={`py-2 rounded-lg transition-all ${activeTab === 'deleteClass' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                        >
                            🗑️ 학급 데이터 일괄 관리
                        </button>
                    </div>

                    {/* 탭 1: 게임 룰 및 교사 방 생성 */}
                    {activeTab === 'settings' && (
                        <div className="space-y-5 animate-in fade-in">
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label className="block text-xs font-bold text-slate-700 mb-2">대결 모드 선택</label>
                                <div className="grid grid-cols-3 gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setBattleMode('class')}
                                        className={`py-2.5 rounded-xl font-bold text-xs border-2 transition-all ${battleMode === 'class' ? 'border-purple-500 bg-purple-50 text-purple-700' : 'border-slate-200 bg-white text-slate-600'}`}
                                    >
                                        학급 전체 개인전
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setBattleMode('team')}
                                        className={`py-2.5 rounded-xl font-bold text-xs border-2 transition-all ${battleMode === 'team' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-200 bg-white text-slate-600'}`}
                                    >
                                        팀 대결 (Red vs Blue)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setBattleMode('1v1')}
                                        className={`py-2.5 rounded-xl font-bold text-xs border-2 transition-all ${battleMode === '1v1' ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-slate-200 bg-white text-slate-600'}`}
                                    >
                                        1:1 진검승부
                                    </button>
                                </div>
                            </div>

                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label className="block text-xs font-bold text-slate-700 mb-2">게임 제한 시간</label>
                                <div className="grid grid-cols-4 gap-2 mb-3">
                                    {[60, 90, 120, 180].map(time => (
                                        <button
                                            key={time}
                                            type="button"
                                            onClick={() => setTimeLimit(time)}
                                            className={`py-2 rounded-lg font-bold text-xs border-2 transition-all ${timeLimit === time ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-600'}`}
                                        >
                                            {time}초
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold text-slate-600">직접 설정:</span>
                                    <input
                                        type="number"
                                        min="30"
                                        max="600"
                                        value={timeLimit}
                                        onChange={(e) => setTimeLimit(parseInt(e.target.value) || 90)}
                                        className="w-24 p-1.5 text-center text-xs font-bold border rounded-lg bg-white"
                                    />
                                    <span className="text-xs font-bold text-slate-500">초</span>
                                </div>
                            </div>

                            <button
                                type="button"
                                onClick={() => onCreateRoom(battleMode, timeLimit, true)}
                                className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-bold text-sm shadow-md flex items-center justify-center gap-2"
                            >
                                <i className="fas fa-play-circle"></i> 선생님 호스트로 방 생성하기
                            </button>

                            <div className="pt-4 border-t border-slate-200">
                                <label className="block text-xs font-bold text-slate-700 mb-2">교사 비밀번호 변경</label>
                                <div className="flex gap-2">
                                    <input
                                        type="password"
                                        value={newPwd}
                                        onChange={(e) => setNewPwd(e.target.value)}
                                        placeholder="새 비밀번호 입력"
                                        className="flex-1 p-2 text-xs font-bold border rounded-lg bg-white"
                                    />
                                    <button
                                        type="button"
                                        onClick={handleChangePwd}
                                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold"
                                    >
                                        변경 저장
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 탭 2: 학생 연성 성적표 */}
                    {activeTab === 'records' && (
                        <div className="space-y-3 animate-in fade-in">
                            <div className="flex flex-wrap gap-2 items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <div className="flex gap-2 flex-wrap flex-1">
                                    <select
                                        value={filterG}
                                        onChange={(e) => setFilterG(e.target.value)}
                                        className="p-1.5 text-xs font-bold border rounded-lg bg-white"
                                    >
                                        <option value="ALL">전체 학년</option>
                                        <option value="3">3학년</option>
                                        <option value="4">4학년</option>
                                        <option value="5">5학년</option>
                                        <option value="6">6학년</option>
                                    </select>
                                    <select
                                        value={filterC}
                                        onChange={(e) => setFilterC(e.target.value)}
                                        className="p-1.5 text-xs font-bold border rounded-lg bg-white"
                                    >
                                        <option value="ALL">전체 반</option>
                                        {Array.from({ length: 15 }, (_, i) => i + 1).map(c => (
                                            <option key={c} value={c}>{c}반</option>
                                        ))}
                                    </select>
                                    <input
                                        type="text"
                                        value={searchName}
                                        onChange={(e) => setSearchName(e.target.value)}
                                        placeholder="학생 이름 검색..."
                                        className="p-1.5 text-xs font-bold border rounded-lg bg-white w-36"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        type="button"
                                        onClick={downloadCSV}
                                        className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm flex items-center gap-1"
                                    >
                                        <i className="fas fa-file-csv"></i> CSV 다운로드
                                    </button>
                                    <button
                                        type="button"
                                        onClick={loadRecords}
                                        className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold"
                                    >
                                        <i className="fas fa-sync-alt"></i> 새로고침
                                    </button>
                                </div>
                            </div>

                            <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white max-h-96 custom-scrollbar">
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead className="bg-slate-50 border-b border-slate-200 font-bold text-slate-600">
                                        <tr>
                                            <th className="p-2.5 text-center w-12">순위</th>
                                            <th className="p-2.5">학적 및 학생명</th>
                                            <th className="p-2.5 text-right w-24">누적 점수</th>
                                            <th className="p-2.5 text-center w-24">연성 단어수</th>
                                            <th className="p-2.5 text-center w-28">최근 플레이</th>
                                            <th className="p-2.5 text-center w-16">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loadingRecords ? (
                                            <tr>
                                                <td colSpan="6" className="text-center py-10 text-slate-400 font-bold">기록을 불러오는 중...</td>
                                            </tr>
                                        ) : filteredRecords.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="text-center py-10 text-slate-400 font-bold">해당 조건의 학생 기록이 없습니다.</td>
                                            </tr>
                                        ) : (
                                            filteredRecords.map((r, i) => (
                                                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                    <td className="p-2.5 text-center font-black text-slate-400">{i + 1}</td>
                                                    <td className="p-2.5 font-bold text-slate-800">{r.name}</td>
                                                    <td className="p-2.5 text-right font-black text-indigo-600">{r.score.toLocaleString()}점</td>
                                                    <td className="p-2.5 text-center font-bold text-emerald-600">{r.wordCount}개</td>
                                                    <td className="p-2.5 text-center text-slate-400 text-[11px]">{r.date ? new Date(r.date).toLocaleDateString() : '-'}</td>
                                                    <td className="p-2.5 text-center">
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteSingleStudent(r.name)}
                                                            className="px-2 py-1 text-[11px] font-bold text-red-600 hover:bg-red-50 border border-red-200 rounded"
                                                        >
                                                            삭제
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* 탭 3: 특정 학급 일괄 삭제 (3~6학년, 1~15반) */}
                    {activeTab === 'deleteClass' && (
                        <div className="p-4 bg-red-50 border border-red-200 rounded-xl space-y-4 animate-in fade-in">
                            <div>
                                <h3 className="text-sm font-black text-red-700 flex items-center gap-1.5 mb-1">
                                    <i className="fas fa-trash-alt"></i> 특정 학급 기록 일괄 삭제
                                </h3>
                                <p className="text-xs text-red-600">
                                    학기 말 또는 새로운 수업을 위해 특정 학급(방장 및 참가자)의 모든 대결 방 기록을 영구 삭제합니다.
                                </p>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap">
                                <select
                                    value={delG}
                                    onChange={(e) => setDelG(e.target.value)}
                                    className="p-2 text-xs font-bold border rounded-lg bg-white"
                                >
                                    <option value="">학년 선택</option>
                                    <option value="3">3학년</option>
                                    <option value="4">4학년</option>
                                    <option value="5">5학년</option>
                                    <option value="6">6학년</option>
                                </select>
                                <select
                                    value={delC}
                                    onChange={(e) => setDelC(e.target.value)}
                                    className="p-2 text-xs font-bold border rounded-lg bg-white"
                                >
                                    <option value="">반 선택</option>
                                    {Array.from({ length: 15 }, (_, i) => i + 1).map(c => (
                                        <option key={c} value={c}>{c}반</option>
                                    ))}
                                </select>
                                <button
                                    type="button"
                                    onClick={handleDeleteClassRooms}
                                    className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold shadow-md"
                                >
                                    해당 학급 대결 기록 영구 삭제
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ════════════════════════════════════════════════════════════════════
        // ── 5. 대기실 화면 (WaitingRoomView) ──
        // ════════════════════════════════════════════════════════════════════
        function WaitingRoomView({ roomData, user, appId, onExit }) {
            const isHost = roomData.hostId === user.uid;
            const players = Object.entries(roomData.players || {});
            const isTeamMode = roomData.mode === 'team';
            const timeLimit = roomData.timeLimit || 90;

            const handleStartGame = async () => {
                if (!isHost) return;
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                await updateDoc(roomRef, {
                    status: 'playing',
                    endTime: Date.now() + timeLimit * 1000,
                    letters: generateLetters(),
                    words: {},
                    meanings: {}
                });
            };

            const handleSwitchTeam = async () => {
                if (!isTeamMode) return;
                const currentTeam = roomData.players[user.uid]?.team === 'red' ? 'blue' : 'red';
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', ROOMS_COLLECTION, roomData.roomId);
                await updateDoc(roomRef, { [`players.${user.uid}.team`]: currentTeam });
            };

            return (
                <div className="alch-card max-w-2xl mx-auto w-full space-y-4 animate-in zoom-in-95">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                        <div>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-extrabold border border-indigo-100">
                                {roomData.mode === '1v1' ? '1:1 진검승부' : roomData.mode === 'team' ? '학급 팀 대결' : '학급 개인전'} ({timeLimit}초)
                            </span>
                            <p className="text-xs text-slate-400 mt-1">친구들에게 4자리 초대 코드를 공유하세요!</p>
                        </div>
                        <div className="text-right">
                            <span className="text-xs font-bold text-slate-400 block">초대 코드</span>
                            <span className="text-3xl font-black text-amber-500 tracking-widest">{roomData.roomId}</span>
                        </div>
                    </div>

                    {/* 참가자 리스트 */}
                    <div className="min-h-[160px] p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <div className="text-xs font-bold text-slate-600 mb-2">참여 연금술사 ({players.length}명)</div>
